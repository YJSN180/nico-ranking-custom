name = "nico-ranking-api-gateway"
main = "workers/api-gateway-smart-router-v2.ts"
compatibility_date = "2025-06-24"
compatibility_flags = ["nodejs_compat"]

# KV namespace bindings (for video stats)
[[kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# KV namespace for maintenance flags
[[kv_namespaces]]
binding = "MAINTENANCE_FLAGS"
id = "19c56f381658417397c0b19320167a26"
preview_id = "5a1a431dc05942ca84e29de4a86f6932"

# R2 bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nico-ranking"

# 環境変数
[vars]
VERCEL_DEPLOYMENT_URL = "https://nico-ranking-custom-yjsns-projects.vercel.app"
WORKER_AUTH_KEY = "c8d0aeead3a77d1a88438d5275398fda20efd5db8f98186c524d478362ffa493"

# Custom domain
[[routes]]
pattern = "nico-rank.com/*"
zone_name = "nico-rank.com"

# Service Bindings - Version-based
[[services]]
binding = "WORKER_V1_STABLE"
service = "nico-ranking-v1-stable"

# Legacy bindings (後方互換性)
[[services]]
binding = "WORKER_BLUE"
service = "nico-ranking-blue"

[[services]]
binding = "WORKER_GREEN"
service = "nico-ranking-green"

# TypeScript設定
[build]
command = ""