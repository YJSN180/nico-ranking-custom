name = "nico-ranking-api-gateway-green"
account_id = "5984977746a3dfcd71415bed5c324eb1"
main = "workers/api-gateway-green-20250726.ts"
compatibility_date = "2025-06-24"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# KV namespace bindings (for video stats)
[[kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# KV namespace for maintenance flags
[[kv_namespaces]]
binding = "MAINTENANCE_FLAGS"
id = "19c56f381658417397c0b19320167a26"
preview_id = "5a1a431dc05942ca84e29de4a86f6932"

# R2 bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nico-ranking"

# Rate Limiting binding
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
# 120 requests per minute (1分間に120リクエスト - 大幅緩和)
simple = { limit = 120, period = 60 }

# 環境変数
[vars]
VERCEL_DEPLOYMENT_URL = "https://nico-ranking-custom-yjsns-projects.vercel.app"
ENVIRONMENT = "green"
# WORKER_AUTH_KEY and SENTRY_WORKER_DSN are set via Cloudflare Secrets

# TypeScript設定
[build]
command = ""
