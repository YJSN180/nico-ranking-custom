name = "nico-ranking-green"
main = "workers/api-gateway-r2-with-dynamic-ttl-and-kv-maintenance.ts"
compatibility_date = "2025-06-24"
compatibility_flags = ["nodejs_compat"]

# KV namespace bindings
[[kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

[[kv_namespaces]]
binding = "MAINTENANCE_FLAGS"
id = "19c56f381658417397c0b19320167a26"

# R2 bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nico-ranking"

# 環境変数
[vars]
VERCEL_DEPLOYMENT_URL = "https://nico-ranking-custom-yjsns-projects.vercel.app"

# TypeScript設定
[build]
command = ""