name = "video-stats-updater"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5984977746a3dfcd71415bed5c324eb1"
upload_source_maps = true

# Cron trigger - runs every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# KV namespace binding for storing video stats
[[kv_namespaces]]
binding = "STATS_KV"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# R2 bucket binding for reading ranking data
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nico-ranking"

# Worker auth key for manual triggers is managed as a Cloudflare secret
[vars]
ENVIRONMENT = "production"
# WORKER_AUTH_KEY and SENTRY_WORKER_DSN are set via Cloudflare Secrets

# Environment-specific settings
[env.production]
name = "video-stats-updater"

[env.staging]
name = "video-stats-updater-staging"

# Development settings
[dev]
port = 8788

# Observability settings for debugging
[observability]
enabled = true
