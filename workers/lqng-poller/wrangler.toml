name = "lqng-poller"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5984977746a3dfcd71415bed5c324eb1"
upload_source_maps = true

# 差分ポーリング（15 分）と、前日分の日次スイープ（05:10〜14:10 JST の毎時 10 分 = 20:10〜05:10 UTC）。
# スイープは Snapshot の索引が前日分を含むまで待ち、済んだ日は設定と追跡表を読むだけで抜ける
[triggers]
crons = ["*/15 * * * *", "10 20-23,0-5 * * *"]

# 既存の名前空間を共用（キーは lqng: 接頭辞で分離）
[[kv_namespaces]]
binding = "LQNG_KV"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

[vars]
ENVIRONMENT = "production"
# WORKER_AUTH_KEY（/trigger 用）と SENTRY_WORKER_DSN は Cloudflare Secrets で設定する

# 環境は束縛（kv_namespaces）と vars を最上位から引き継がないので、環境ごとに書く。
# 本番のデプロイ（deploy-worker.yml）は最上位を使う。--env production も同じ Worker・同じ KV になる
[env.production]
name = "lqng-poller"

[[env.production.kv_namespaces]]
binding = "LQNG_KV"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

[env.production.vars]
ENVIRONMENT = "production"

# staging は本番の KV に書かない（判定表の書き手を本番のポーリング 1 つに保つ）。ID を書かない束縛は、
# 初回の wrangler deploy --env staging で lqng-poller-staging 用の名前空間が作られる（自動の用意）。
# スケジュールでは動かさず、/trigger で手動で動かす
[env.staging]
name = "lqng-poller-staging"

[env.staging.triggers]
crons = []

[[env.staging.kv_namespaces]]
binding = "LQNG_KV"

[env.staging.vars]
ENVIRONMENT = "staging"

[dev]
port = 8789

[observability]
enabled = true
