# Tag Autocomplete Worker Configuration
name = "nico-ranking-tag-autocomplete"
main = "tag-autocomplete.ts"
compatibility_date = "2025-06-24"
workers_dev = true

# Environment
[env.production]
name = "nico-ranking-tag-autocomplete"
vars = { ENVIRONMENT = "production" }

# KV Namespaces for tag data
[[kv_namespaces]]
binding = "TAG_INDEX"
id = "409d414b309e49a9b9b36b3f08a428d9"

[[kv_namespaces]]
binding = "TAG_DATA"
id = "4192117779df49ba8550a961e12dfd81"

# Routes (production)
[[routes]]
pattern = "nico-rank.com/api/tags/autocomplete"
zone_name = "nico-rank.com"

# Performance settings
[limits]
cpu_ms = 10

[placement]
mode = "smart"