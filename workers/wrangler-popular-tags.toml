# Popular Tags API Worker Configuration
# Migrated from Vercel Functions to reduce costs

name = "nico-ranking-popular-tags-api"
main = "popular-tags-api.ts"
compatibility_date = "2025-06-24"

# Workers configuration
workers_dev = false
minify = true

# KV Namespace binding - using the same namespace as main API gateway
[[kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# Routes - serves under the main domain
[[routes]]
pattern = "nico-rank.com/api/popular-tags"
zone_name = "nico-rank.com"

# Environment variables (if needed)
[vars]
WORKER_ENV = "production"

# Development environment
[env.dev]
name = "nico-ranking-popular-tags-dev"
vars = { WORKER_ENV = "development" }

[[env.dev.kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# Staging environment
[env.staging]
name = "nico-ranking-popular-tags-staging"
vars = { WORKER_ENV = "staging" }

[[env.staging.kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# Enable smart placement for optimal performance
[placement]
mode = "smart"

# Browser rendering (not needed for this API)
# [browser]
# binding = "BROWSER"

# Limits
[limits]
cpu_ms = 50

# Build configuration
[build]
command = ""

# Observability
[observability]
enabled = true

# Tail consumers (for logging)
[[tail_consumers]]
service = "nico-ranking-logger"
environment = "production"