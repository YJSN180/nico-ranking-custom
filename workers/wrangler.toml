name = "nico-ranking-api-gateway"
main = "api-gateway-green-20250726.ts"
compatibility_date = "2024-12-01"
account_id = "5984977746a3dfcd71415bed5c324eb1"

[[kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nico-ranking"

[vars]
VERCEL_DEPLOYMENT_URL = "https://nico-ranking-custom-2ezx48med-yjsns-projects.vercel.app"

# Rate Limiting binding (20 requests per minute)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
