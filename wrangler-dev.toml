# 開発・テスト用Worker設定
name = "nico-ranking-dynamic-cache-dev"
main = "workers/api-gateway-dynamic-cache.ts"
compatibility_date = "2024-10-01"

# 開発環境の変数
[vars]
ENVIRONMENT = "development"
DEBUG_MODE = "true"

# 本番と同じR2バケットを使用（読み取り専用で安全）
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "nico-ranking"

[placement]
mode = "smart"

# 開発用のカスタムドメイン（オプション）
# routes = [
#   { pattern = "dev-api.nico-rank.com/*", zone_name = "nico-rank.com" }
# ]