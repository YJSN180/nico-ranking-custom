<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Session Restoration Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .warning {
      background-color: #fff3cd;
      color: #856404;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>PWA Session Restoration Test</h1>
  
  <div class="section">
    <h2>PWA Detection</h2>
    <div id="pwa-status" class="status"></div>
  </div>

  <div class="section">
    <h2>Storage Test</h2>
    <button onclick="saveTestData()">Save Test Data</button>
    <button onclick="loadTestData()">Load Test Data</button>
    <button onclick="clearTestData()">Clear Test Data</button>
    <div id="storage-status" class="status"></div>
  </div>

  <div class="section">
    <h2>Session State</h2>
    <div id="session-state"></div>
  </div>

  <div class="section">
    <h2>Test Actions</h2>
    <button onclick="simulateNavigation()">Simulate Navigation Save</button>
    <button onclick="checkRestorationData()">Check Restoration Data</button>
    <button onclick="testFullFlow()">Test Full Flow</button>
  </div>

  <div class="section">
    <h2>Console Log</h2>
    <pre id="console-log"></pre>
  </div>

  <script>
    // PWA検出
    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             (window.navigator).standalone === true ||
             document.referrer.includes('android-app://');
    }

    // ログ追加
    function log(message, type = 'info') {
      const logEl = document.getElementById('console-log');
      const timestamp = new Date().toLocaleTimeString('ja-JP');
      const logEntry = `[${timestamp}] ${message}\n`;
      logEl.textContent += logEntry;
      console.log(message);
    }

    // 初期化
    function init() {
      // PWA状態を表示
      const pwaStatusEl = document.getElementById('pwa-status');
      const isPWAMode = isPWA();
      pwaStatusEl.className = `status ${isPWAMode ? 'success' : 'warning'}`;
      pwaStatusEl.innerHTML = `
        <strong>PWA Mode:</strong> ${isPWAMode ? 'Yes' : 'No'}<br>
        <strong>Display Mode:</strong> ${window.matchMedia('(display-mode: standalone)').matches ? 'Standalone' : 'Browser'}<br>
        <strong>iOS Standalone:</strong> ${(window.navigator).standalone === true ? 'Yes' : 'No'}<br>
        <strong>User Agent:</strong> ${navigator.userAgent}
      `;
      
      // 既存のセッション状態を表示
      checkRestorationData();
    }

    // テストデータ保存
    function saveTestData() {
      const testData = {
        genre: 'game',
        period: 'hour',
        tag: 'ゲーム実況',
        page: 2,
        popularTags: ['ゲーム実況', 'RTA', 'ゆっくり実況プレイ'],
        scrollPosition: 500,
        savedAt: Date.now()
      };
      
      localStorage.setItem('ranking-navigation-state', JSON.stringify(testData));
      log('Test data saved to localStorage', 'success');
      checkRestorationData();
    }

    // テストデータ読み込み
    function loadTestData() {
      try {
        const data = localStorage.getItem('ranking-navigation-state');
        if (data) {
          const parsed = JSON.parse(data);
          log('Test data loaded: ' + JSON.stringify(parsed, null, 2), 'success');
        } else {
          log('No data found in localStorage', 'warning');
        }
      } catch (error) {
        log('Error loading data: ' + error.message, 'error');
      }
    }

    // データクリア
    function clearTestData() {
      localStorage.removeItem('ranking-navigation-state');
      log('Test data cleared from localStorage', 'success');
      checkRestorationData();
    }

    // ナビゲーション保存シミュレート
    function simulateNavigation() {
      const stateToSave = {
        genre: 'vocaloid',
        period: '24h',
        tag: '初音ミク',
        page: 3,
        popularTags: ['初音ミク', 'VOCALOID新曲リンク', 'ミクオリジナル曲'],
        scrollPosition: 1200,
        savedAt: Date.now()
      };
      
      localStorage.setItem('ranking-navigation-state', JSON.stringify(stateToSave));
      log('Navigation state saved (simulated)', 'success');
      checkRestorationData();
    }

    // 復元データ確認
    function checkRestorationData() {
      const storageStatusEl = document.getElementById('storage-status');
      const sessionStateEl = document.getElementById('session-state');
      
      try {
        const data = localStorage.getItem('ranking-navigation-state');
        if (data) {
          const parsed = JSON.parse(data);
          const savedTime = new Date(parsed.savedAt);
          const age = Date.now() - parsed.savedAt;
          const ageMinutes = Math.floor(age / 60000);
          
          // PWAモードでは1時間、通常は30分
          const expirationMinutes = isPWA() ? 60 : 30;
          const isExpired = ageMinutes > expirationMinutes;
          
          storageStatusEl.className = `status ${isExpired ? 'warning' : 'success'}`;
          storageStatusEl.innerHTML = `
            <strong>Data found in localStorage</strong><br>
            Saved at: ${savedTime.toLocaleString('ja-JP')}<br>
            Age: ${ageMinutes} minutes<br>
            Status: ${isExpired ? 'Expired' : 'Valid'}<br>
            Expiration: ${expirationMinutes} minutes
          `;
          
          sessionStateEl.innerHTML = `
            <h3>Saved State:</h3>
            <pre>${JSON.stringify(parsed, null, 2)}</pre>
          `;
        } else {
          storageStatusEl.className = 'status warning';
          storageStatusEl.innerHTML = '<strong>No data found in localStorage</strong>';
          sessionStateEl.innerHTML = '<em>No session state saved</em>';
        }
      } catch (error) {
        storageStatusEl.className = 'status error';
        storageStatusEl.innerHTML = `<strong>Error:</strong> ${error.message}`;
        sessionStateEl.innerHTML = '';
      }
    }

    // フルフローテスト
    async function testFullFlow() {
      log('Starting full flow test...', 'info');
      
      // 1. データ保存
      saveTestData();
      await sleep(1000);
      
      // 2. データ読み込み
      loadTestData();
      await sleep(1000);
      
      // 3. 期限チェック
      checkRestorationData();
      
      log('Full flow test completed', 'success');
    }

    // ユーティリティ
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ページロード時に初期化
    window.addEventListener('load', init);
    
    // localStorageイベントを監視
    window.addEventListener('storage', (e) => {
      if (e.key === 'ranking-navigation-state') {
        log(`Storage event detected: ${e.newValue ? 'Updated' : 'Removed'}`, 'info');
        checkRestorationData();
      }
    });
    
    // PWAイベントを監視
    window.addEventListener('beforeunload', () => {
      log('beforeunload event fired', 'info');
    });
    
    window.addEventListener('pagehide', () => {
      log('pagehide event fired', 'info');
    });
    
    window.addEventListener('blur', () => {
      if (isPWA()) {
        log('blur event fired (PWA mode)', 'info');
      }
    });
  </script>
</body>
</html>
