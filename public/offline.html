<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オフライン - ニコラン(Re:turn)</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #333333;
      --text-sub: #666666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #ffffff;
        --text-sub: #d0d0d0;
      }
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }
    .offline-container {
      text-align: center;
      padding: 40px;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    h1 {
      color: var(--text);
      margin-bottom: 16px;
    }
    .offline-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    .offline-message {
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .retry-button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-button:hover {
      background: #0052a3;
    }
    .offline-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ff4444;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="offline-indicator" data-testid="offline-indicator">
    <span>⚠️</span>
    <span>オフライン</span>
  </div>
  
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>オフラインです</h1>
    <p class="offline-message">
      インターネット接続がありません。<br>
      キャッシュされたコンテンツのみ表示可能です。<br>
      接続が回復したら、再度お試しください。
    </p>
    <button class="retry-button" onclick="window.location.reload()">
      再読み込み
    </button>
  </div>
  
  <script>
    // Check online status periodically
    function checkOnlineStatus() {
      if (navigator.onLine) {
        window.location.reload();
      }
    }
    
    // Check every 5 seconds
    setInterval(checkOnlineStatus, 5000);
    
    // Also check on online event
    window.addEventListener('online', checkOnlineStatus);
  </script>
</body>
</html>
