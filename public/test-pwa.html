<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Test</title>
</head>
<body>
  <h1>PWA Service Worker Test</h1>
  <div id="status">Checking service worker...</div>
  <div id="caches">Checking caches...</div>
  
  <script>
    async function checkPWA() {
      const statusEl = document.getElementById('status');
      const cachesEl = document.getElementById('caches');
      
      if ('serviceWorker' in navigator) {
        try {
          // Register service worker
          const registration = await navigator.serviceWorker.register('/sw.js');
          console.log('SW registered:', registration);
          
          // Wait for ready
          await navigator.serviceWorker.ready;
          console.log('SW ready');
          
          // Check registration status
          const active = registration.active;
          const installing = registration.installing;
          const waiting = registration.waiting;
          
          statusEl.innerHTML = `
            <p>Service Worker Status:</p>
            <ul>
              <li>Active: ${active ? active.state : 'none'}</li>
              <li>Installing: ${installing ? installing.state : 'none'}</li>
              <li>Waiting: ${waiting ? waiting.state : 'none'}</li>
              <li>Scope: ${registration.scope}</li>
            </ul>
          `;
          
          // Check caches
          const cacheNames = await caches.keys();
          const cacheContents = {};
          
          for (const name of cacheNames) {
            const cache = await caches.open(name);
            const keys = await cache.keys();
            cacheContents[name] = keys.map(req => req.url);
          }
          
          cachesEl.innerHTML = `
            <p>Caches:</p>
            <pre>${JSON.stringify(cacheContents, null, 2)}</pre>
          `;
          
        } catch (error) {
          statusEl.innerHTML = `Error: ${error.message}`;
        }
      } else {
        statusEl.innerHTML = 'Service Worker not supported';
      }
    }
    
    // Check on load
    window.addEventListener('load', checkPWA);
    
    // Refresh every 2 seconds
    setInterval(checkPWA, 2000);
  </script>
</body>
</html>
