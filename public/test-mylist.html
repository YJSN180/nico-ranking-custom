<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイリスト機能テスト</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #output {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .mylist-item {
            background: #fff;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>マイリスト機能のブラウザテスト</h1>
    
    <div class="section">
        <h2>IndexedDB接続テスト</h2>
        <button onclick="testIndexedDB()">IndexedDBをテスト</button>
        <button onclick="clearDatabase()">データベースをクリア</button>
    </div>

    <div class="section">
        <h2>マイリスト作成テスト</h2>
        <button onclick="createDefaultMylist()">デフォルトマイリスト作成</button>
        <button onclick="createCustomMylist()">カスタムマイリスト作成</button>
    </div>

    <div class="section">
        <h2>マイリスト一覧</h2>
        <button onclick="listMylists()">マイリスト一覧を取得</button>
        <div id="mylist-container"></div>
    </div>

    <div class="section">
        <h2>出力</h2>
        <div id="output"></div>
    </div>

    <script type="module">
        // グローバルスコープに関数を登録
        window.log = function(message) {
            const output = document.getElementById('output');
            output.textContent += `${new Date().toLocaleTimeString()}: ${message}\n`;
            console.log(message);
        }

        window.testIndexedDB = async function() {
            try {
                const request = indexedDB.open('NicoRankingDB', 2);
                
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    log('✅ IndexedDB接続成功');
                    log(`データベース名: ${db.name}`);
                    log(`バージョン: ${db.version}`);
                    log(`オブジェクトストア: ${Array.from(db.objectStoreNames).join(', ')}`);
                    db.close();
                };
                
                request.onerror = (event) => {
                    log('❌ IndexedDB接続エラー: ' + event.target.error);
                };
                
                request.onupgradeneeded = (event) => {
                    log('🔄 データベースアップグレード中...');
                };
            } catch (error) {
                log('❌ エラー: ' + error.message);
            }
        }

        window.clearDatabase = async function() {
            try {
                await indexedDB.deleteDatabase('NicoRankingDB');
                log('🗑️ データベースを削除しました');
            } catch (error) {
                log('❌ 削除エラー: ' + error.message);
            }
        }

        window.createDefaultMylist = async function() {
            try {
                // DBManagerとMylistManagerを動的にインポート
                const { DBManager } = await import('./lib/storage/db-manager.js');
                const { MylistManager } = await import('./lib/storage/mylists.js');
                
                const dbManager = new DBManager();
                await dbManager.init();
                const mylistManager = new MylistManager(dbManager);
                
                const defaultMylist = await mylistManager.getOrCreateDefaultMylist();
                log('✅ デフォルトマイリスト作成/取得成功');
                log(JSON.stringify(defaultMylist, null, 2));
            } catch (error) {
                log('❌ エラー: ' + error.message);
                log(error.stack);
            }
        }

        window.createCustomMylist = async function() {
            try {
                const { DBManager } = await import('./lib/storage/db-manager.js');
                const { MylistManager } = await import('./lib/storage/mylists.js');
                
                const dbManager = new DBManager();
                await dbManager.init();
                const mylistManager = new MylistManager(dbManager);
                
                const newMylist = await mylistManager.createMylist(
                    'テストマイリスト ' + Date.now(),
                    'これはテスト用のマイリストです'
                );
                log('✅ カスタムマイリスト作成成功');
                log(JSON.stringify(newMylist, null, 2));
            } catch (error) {
                log('❌ エラー: ' + error.message);
                log(error.stack);
            }
        }

        window.listMylists = async function() {
            try {
                const { DBManager } = await import('./lib/storage/db-manager.js');
                const { MylistManager } = await import('./lib/storage/mylists.js');
                
                const dbManager = new DBManager();
                await dbManager.init();
                const mylistManager = new MylistManager(dbManager);
                
                const mylists = await mylistManager.getAllMylists();
                log(`✅ マイリスト一覧取得成功 (${mylists.length}件)`);
                
                const container = document.getElementById('mylist-container');
                container.innerHTML = '';
                
                mylists.forEach(mylist => {
                    const div = document.createElement('div');
                    div.className = 'mylist-item';
                    div.innerHTML = `
                        <strong>${mylist.name}</strong>
                        ${mylist.isDefault ? '<span style="color: blue;"> (デフォルト)</span>' : ''}
                        <br>
                        動画数: ${mylist.videoCount}
                        <br>
                        <small>${mylist.description || '説明なし'}</small>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                log('❌ エラー: ' + error.message);
                log(error.stack);
            }
        }
    </script>
</body>
</html>
