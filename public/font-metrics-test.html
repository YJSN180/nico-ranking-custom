<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Metrics Test</title>
  <style>
    @font-face {
      font-family: 'Nicomoji Plus v2';
      src: url('/fonts/nicomoji-plus-v2.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    
    .test-container {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border: 1px solid #ccc;
    }
    
    .test-text {
      font-size: 48px;
      line-height: 1;
      margin: 0;
      padding: 0;
      border: 1px solid red;
      display: inline-block;
    }
    
    .fallback {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    }
    
    .custom {
      font-family: "Nicomoji Plus v2", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    }
    
    .metrics-display {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>フォントメトリクス測定ツール</h1>
  
  <div class="test-container">
    <h2>フォールバックフォント（Hiragino/Meiryo）</h2>
    <p class="test-text fallback" id="fallback">ニコラン</p>
    <div class="metrics-display" id="fallback-metrics"></div>
  </div>
  
  <div class="test-container">
    <h2>カスタムフォント（Nicomoji Plus v2）</h2>
    <p class="test-text custom" id="custom">ニコラン</p>
    <div class="metrics-display" id="custom-metrics"></div>
  </div>
  
  <div class="test-container">
    <h2>推奨メトリクス値</h2>
    <div id="recommendations"></div>
  </div>
  
  <script>
    function measureElement(id) {
      const element = document.getElementById(id);
      const rect = element.getBoundingClientRect();
      const computed = window.getComputedStyle(element);
      
      return {
        width: rect.width,
        height: rect.height,
        fontSize: computed.fontSize,
        lineHeight: computed.lineHeight,
        actualHeight: element.offsetHeight
      };
    }
    
    function calculateMetrics() {
      const fallback = measureElement('fallback');
      const custom = measureElement('custom');
      
      // メトリクスを表示
      document.getElementById('fallback-metrics').innerHTML = 
        `幅: ${fallback.width.toFixed(2)}px, 高さ: ${fallback.height.toFixed(2)}px`;
      
      document.getElementById('custom-metrics').innerHTML = 
        `幅: ${custom.width.toFixed(2)}px, 高さ: ${custom.height.toFixed(2)}px`;
      
      // 推奨値を計算
      const sizeAdjust = (fallback.width / custom.width * 100).toFixed(1);
      const heightRatio = fallback.height / custom.height;
      
      document.getElementById('recommendations').innerHTML = `
        <pre>
@font-face {
  font-family: 'Nicomoji Plus v2';
  src: url('/fonts/nicomoji-plus-v2.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
  /* 推奨メトリクス値 */
  size-adjust: ${sizeAdjust}%;
  ascent-override: ${(heightRatio * 90).toFixed(0)}%;
  descent-override: ${(heightRatio * 20).toFixed(0)}%;
  line-gap-override: 0%;
}
        </pre>
        <p>幅の比率: ${(fallback.width / custom.width).toFixed(3)}</p>
        <p>高さの比率: ${heightRatio.toFixed(3)}</p>
      `;
    }
    
    // フォント読み込み完了後に測定
    if (document.fonts) {
      document.fonts.ready.then(() => {
        setTimeout(calculateMetrics, 100);
      });
    } else {
      window.addEventListener('load', () => {
        setTimeout(calculateMetrics, 1000);
      });
    }
  </script>
</body>
</html>
