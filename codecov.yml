# Codecov configuration for Vitest coverage
# Documentation: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 32%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 35%
        threshold: 2%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no

# Ignore paths (matching vitest.config.ts excludes)
ignore:
  - "node_modules/**/*"
  - "coverage/**/*"
  - "dist/**/*"
  - "**/*.d.ts"
  - "**/*.config.*"
  - "__tests__/**/*"
  - "app/admin/**/*"
  - "app/api/admin/**/*"
  - "app/api/debug/**/*"
  - "app/layout.tsx"
  - "app/privacy/**/*"
  - "components/footer.tsx"
  - "components/web-vitals-reporter.tsx"
  - "lib/totp.ts"
  - "lib/web-vitals.ts"
  - "scripts/**/*"
  - "types/**/*"
  - "workers/**/*"
  - ".next/**/*"
  - "public/**/*"
  - "**/*.css"
  - "**/*.json"
  - "middleware.ts"
  - "instrumentation.ts"

github_checks:
  annotations: true