name = "nico-ranking-api-gateway"
main = "workers/api-gateway-optimized.ts"
compatibility_date = "2024-06-13"

# KV namespace bindings
[[kv_namespaces]]
binding = "RANKING_DATA"
id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"

# Environment variables
[vars]
NEXT_APP_URL = "https://nico-ranking-custom-yjsns-projects.vercel.app"

# Custom domain (test subdomain first)
# Note: Using main domain since kv-test subdomain may not be configured
[[routes]]
pattern = "nico-rank.com/*"
zone_name = "nico-rank.com"

# TypeScript configuration
[build]
command = ""
[build.upload]
format = "modules"
main = "workers/api-gateway-optimized.ts"