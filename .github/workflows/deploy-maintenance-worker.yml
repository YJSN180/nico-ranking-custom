name: Deploy Maintenance Worker

on:
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: 'Enable maintenance mode'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create temporary wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "nico-ranking-api-gateway"
          main = "workers/api-gateway-r2-with-maintenance.ts"
          compatibility_date = "2025-06-24"
          compatibility_flags = ["nodejs_compat"]
          
          [[kv_namespaces]]
          binding = "RANKING_DATA"
          id = "80f4535c379b4e8cb89ce6dbdb7d2dc9"
          
          [[r2_buckets]]
          binding = "R2_BUCKET"
          bucket_name = "nico-ranking"
          
          [vars]
          VERCEL_DEPLOYMENT_URL = "https://nico-ranking-custom-yjsns-projects.vercel.app"
          MAINTENANCE_MODE = "${{ github.event.inputs.maintenance_mode }}"
          ALLOWED_IPS = "27.94.226.29"
          
          [[routes]]
          pattern = "nico-rank.com/*"
          zone_name = "nico-rank.com"
          EOF
      
      - name: Deploy Worker with Maintenance Mode
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
      
      - name: Test deployment
        run: |
          echo "Testing deployment..."
          curl -I https://nico-rank.com/ || echo "Site check completed"
      
      - name: Deployment summary
        run: |
          echo "🚀 Worker deployed successfully!"
          echo "- Maintenance mode: ${{ github.event.inputs.maintenance_mode }}"
          echo "- Allowed IP: 27.94.226.29"
          echo "- Site: https://nico-rank.com/"