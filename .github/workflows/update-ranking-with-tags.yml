name: Update Nico Ranking Data with Tags (Manual)

on:
  workflow_dispatch:
    inputs:
      enable_tag_fetching:
        description: 'Enable tag fetching'
        required: true
        default: 'true'
        type: boolean
      tag_fetch_max_videos:
        description: 'Maximum videos to fetch tags for (per genre/period)'
        required: true
        default: '500'
        type: string
      tag_fetch_genres:
        description: 'Genres to fetch tags for (comma-separated, empty for all)'
        required: false
        default: ''
        type: string
      test_group:
        description: 'Test with single group (1-8, empty for all)'
        required: false
        default: ''
        type: string

# 同時実行を防ぐ
concurrency:
  group: update-ranking-tags
  cancel-in-progress: false

jobs:
  # Step 1: Fetch rankings in parallel groups
  fetch-rankings:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ${{ fromJson(inputs.test_group && format('[{0}]', inputs.test_group) || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
      max-parallel: 8
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Fetch rankings for group ${{ matrix.group }}
      env:
        # Cloudflare KV credentials
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
        # Tag fetching configuration from inputs
        ENABLE_TAG_FETCHING: ${{ inputs.enable_tag_fetching }}
        TAG_FETCH_MAX_VIDEOS: ${{ inputs.tag_fetch_max_videos }}
        TAG_FETCH_GENRES: ${{ inputs.tag_fetch_genres }}
      run: |
        echo "Starting group ${{ matrix.group }} at $(date)"
        echo "Tag fetching configuration:"
        echo "  ENABLE_TAG_FETCHING: $ENABLE_TAG_FETCHING"
        echo "  TAG_FETCH_MAX_VIDEOS: $TAG_FETCH_MAX_VIDEOS"
        echo "  TAG_FETCH_GENRES: $TAG_FETCH_GENRES"
        
        # Use fallback if KV_NAMESPACE_ID is not set
        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
          echo "Using fallback KV namespace ID"
        fi
        
        npx tsx scripts/update-ranking-parallel-v2.ts --group ${{ matrix.group }} 8
    
    - name: Upload partial results
      uses: actions/upload-artifact@v4
      with:
        name: ranking-data-group-${{ matrix.group }}
        path: ./tmp/ranking-group-${{ matrix.group }}.json
        retention-days: 1
        if-no-files-found: error
    
    - name: Upload NG derived results (if exists)
      uses: actions/upload-artifact@v4
      with:
        name: ng-derived-group-${{ matrix.group }}
        path: ./tmp/ng-derived-group-${{ matrix.group }}.json
        retention-days: 1
        if-no-files-found: ignore

  # Step 2: Aggregate results and write to KV
  aggregate-and-write:
    needs: fetch-rankings
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create temp directory
      run: mkdir -p ./tmp
    
    - name: Download ranking artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ranking-data-group-*
    
    - name: Download NG derived artifacts (if exists)
      uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ng-derived-group-*
      continue-on-error: true
    
    - name: List downloaded files
      run: |
        echo "Downloaded artifacts:"
        ls -la ./tmp/
        echo "Complete directory structure:"
        find ./tmp -type f -name "*.json" | sort
    
    - name: Move files to correct location
      run: |
        # GitHub Actions creates subdirectories for each artifact
        for file in $(find ./tmp -type f -name "*.json" | grep -v "^./tmp/[^/]*\.json$"); do
          echo "Moving: $file"
          mv "$file" ./tmp/ 2>/dev/null || echo "Failed to move: $file"
        done
        
        echo ""
        echo "Files after moving:"
        ls -la ./tmp/ranking-group-*.json 2>/dev/null || echo "No ranking group files found"
        echo ""
        echo "Total ranking group files found: $(ls ./tmp/ranking-group-*.json 2>/dev/null | wc -l)"
        echo "Total NG derived files found: $(ls ./tmp/ng-derived-group-*.json 2>/dev/null | wc -l)"
    
    - name: Aggregate and write to KV
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
      run: |
        echo "Aggregating results and writing to KV..."
        echo "Expected group files: ${{ inputs.test_group && '1' || '8' }}"
        echo "Found group files: $(ls ./tmp/ranking-group-*.json 2>/dev/null | wc -l)"
        
        # Use fallback if KV_NAMESPACE_ID is not set
        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
          echo "Using fallback KV namespace ID"
        fi
        
        npx tsx scripts/aggregate-ranking-results-direct.ts
    
    - name: Write to R2
      if: success()
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "📤 Uploading to R2..."
        npx tsx scripts/write-to-r2.ts
    
    - name: Report completion
      run: |
        echo "✅ Ranking update with tags completed at $(date)"
        echo "Tag fetching was: ${{ inputs.enable_tag_fetching && 'ENABLED' || 'DISABLED' }}"
        if [ "${{ inputs.enable_tag_fetching }}" = "true" ]; then
          echo "  Max videos per genre/period: ${{ inputs.tag_fetch_max_videos }}"
          echo "  Genres: ${{ inputs.tag_fetch_genres || 'ALL' }}"
        fi