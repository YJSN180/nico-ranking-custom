name: E2E Monitoring

on:
  schedule:
    # Keep the existing four-hour cadence. Broader checks remain manual.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Monitoring scope (full = all monitoring checks on supported browsers)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
          - performance
          - accessibility

env:
  NODE_VERSION: '20'

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke-tests
        run: npx playwright test --config=playwright.monitoring.config.ts --project=chromium --grep=@smoke

      # Keep the main branch probe: verify ranking JSON and unauthenticated
      # admin rejection directly on Green, independently of public-zone bot checks.
      - name: Check Green API Worker health (workers.dev)
        id: api-health
        if: ${{ !cancelled() }}
        run: node scripts/check-admin-gateway.mjs --worker nico-ranking-api-gateway-green --direct-only

      - name: Performance check
        id: performance
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'performance' }}
        run: npx playwright test --config=playwright.monitoring.config.ts --project=chromium --grep=@performance

      - name: Accessibility check
        id: accessibility
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'accessibility' }}
        run: npx playwright test --config=playwright.monitoring.config.ts --project=chromium --grep=@accessibility

      - name: Create issue on repeated failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'e2e-monitoring.yml',
              status: 'completed',
              created: `>${new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()}`
            });
            // This failed run is still in progress; include it exactly once.
            const failureCount = 1 + runs.workflow_runs.filter(run =>
              run.id !== context.runId && run.conclusion === 'failure'
            ).length;
            if (failureCount >= 3) {
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'e2e-monitoring,automated',
                state: 'open'
              });
              if (existingIssues.data.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'E2E Monitoring: Repeated Failures Detected',
                  body: `At least three monitoring runs failed in the past 24 hours. Inspect the failed steps; a failure may be in setup, browser checks, or the ranking API.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  labels: ['e2e-monitoring', 'automated', 'bug']
                });
              }
            }

  manual-comprehensive:
    # There is no weekly schedule: do not imply one or change production cadence.
    if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run all monitoring checks
        run: npx playwright test --config=playwright.monitoring.config.ts --project=${{ matrix.browser }}
