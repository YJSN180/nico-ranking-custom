name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker name to deploy (e.g., nico-ranking-v1-stable)'
        required: true
        type: string
      worker_file:
        description: 'Worker file path (e.g., workers/api-gateway-r2.ts)'
        required: true
        type: string
      wrangler_config:
        description: 'Wrangler config file (e.g., wrangler-green.toml)'
        required: false
        default: 'wrangler.toml'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_WORKERS }}
        run: |
          if [ "${{ inputs.wrangler_config }}" != "wrangler.toml" ]; then
            npx wrangler deploy ${{ inputs.worker_file }} \
              --name ${{ inputs.worker_name }} \
              -c ${{ inputs.wrangler_config }}
          else
            npx wrangler deploy ${{ inputs.worker_file }} \
              --name ${{ inputs.worker_name }}
          fi

      - name: Sync Cloudflare Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          SENTRY_WORKER_DSN: ${{ secrets.SENTRY_WORKER_DSN }}
        run: |
          if [ -z "$WORKER_AUTH_KEY" ]; then
            echo "WORKER_AUTH_KEY secret is not configured"
            exit 1
          fi

          # Migrate away from legacy plain-text vars before reattaching the same
          # binding name as a secret. `secret put` deploys immediately.
          printf '%s' "$WORKER_AUTH_KEY" | npx wrangler secret put WORKER_AUTH_KEY -c ${{ inputs.wrangler_config }}

          if [ -n "$SENTRY_WORKER_DSN" ]; then
            printf '%s' "$SENTRY_WORKER_DSN" | npx wrangler secret put SENTRY_WORKER_DSN -c ${{ inputs.wrangler_config }}
          fi
      
      - name: Verify deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Worker deployed: ${{ inputs.worker_name }}"
          npx wrangler tail ${{ inputs.worker_name }} --format=pretty &
          TAIL_PID=$!
          sleep 10
          kill $TAIL_PID || true
