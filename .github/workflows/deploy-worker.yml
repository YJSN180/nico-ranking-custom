name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker name to deploy (e.g., nico-ranking-v1-stable)'
        required: true
        type: string
      worker_file:
        description: 'Worker file path (e.g., workers/api-gateway-r2.ts)'
        required: true
        type: string
      wrangler_config:
        description: 'Wrangler config file (e.g., wrangler-green.toml)'
        required: false
        default: 'wrangler.toml'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Validate deployment target
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
          WORKER_FILE: ${{ inputs.worker_file }}
          WORKER_CONFIG: ${{ inputs.wrangler_config }}
        run: node scripts/validate-worker-target.mjs "$WORKER_NAME" "$WORKER_FILE" "$WORKER_CONFIG"

      - name: Verify gateway changes
        run: npm run test:admin-security && npm run typecheck:workers

      - name: Deploy Worker
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
          WORKER_FILE: ${{ inputs.worker_file }}
          WORKER_CONFIG: ${{ inputs.wrangler_config }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_WORKERS }}
        run: |
          npx wrangler deploy "$WORKER_FILE" --dry-run --name "$WORKER_NAME" -c "$WORKER_CONFIG"
          npx wrangler deploy "$WORKER_FILE" \
            --name "$WORKER_NAME" \
            -c "$WORKER_CONFIG"

      # Existing secrets are preserved; rotation is a separate operation.

      - name: Record deployed version and check public gateway
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
          WORKER_FILE: ${{ inputs.worker_file }}
          WORKER_CONFIG: ${{ inputs.wrangler_config }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Worker deployed: $WORKER_NAME"
          npx wrangler deployments list --name "$WORKER_NAME" -c "$WORKER_CONFIG"
          node scripts/check-admin-gateway.mjs
