name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies with retry
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          for i in {1..3}; do
            if npm ci; then
              break
            else
              echo "npm ci failed (attempt $i/3), retrying in 30 seconds..."
              sleep 30
            fi
          done

      - name: Type check
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run unit and integration tests
        run: |
          echo "Temporarily skipping tests due to memory issues"
          echo "TODO: Fix memory issues and re-enable tests"

      # Codecov upload disabled - requires token configuration
      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v5
      #   with:
      #     file: ./coverage/coverage-final.json
      #     fail_ci_if_error: true

      # E2E tests - smoke tests only for PRs
      - name: Install Playwright Browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install chromium
      
      - name: Build for E2E tests
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
          KV_METADATA_ID: ${{ secrets.KV_METADATA_ID }}
      
      - name: Run E2E smoke tests
        if: github.event_name == 'pull_request'
        run: |
          # 軽量なスモークテストのみを実行
          npx playwright test tests/e2e/integration.spec.ts \
            --project=chromium \
            --grep="基本的なページ構造|メニューボタン|ジャンルセレクター"
        env:
          CI: true
      
      - name: Upload Playwright report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies with retry
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          for i in {1..3}; do
            if npm ci; then
              break
            else
              echo "npm ci failed (attempt $i/3), retrying in 30 seconds..."
              sleep 30
            fi
          done

      - name: Build application
        run: npm run build

      - name: Check bundle size
        run: |
          npm install -g @next/bundle-analyzer
          ANALYZE=true npm run build

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies with retry
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          for i in {1..3}; do
            if npm ci; then
              break
            else
              echo "npm ci failed (attempt $i/3), retrying in 30 seconds..."
              sleep 30
            fi
          done
      
      - name: Run security audit
        run: npm audit --audit-level=critical || true