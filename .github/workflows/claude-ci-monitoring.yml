name: Claude CI Monitoring

# 定期的にunified-ci.ymlをトリガーし、失敗があればClaudeが自動修正PRを作成
#
# 動作:
# 1. 定期実行（毎日JST 10:00）でunified-ci.ymlをトリガー
# 2. unified-ci.ymlの結果を監視
# 3. 失敗を検知したら自動修正用のブランチを作成
# 4. Claudeが問題を分析・修正
# 5. PRがマージされるまで監視・追加修正
#
# セキュリティ注: ユーザー入力は使用せず、ジョブ出力とシークレットのみ使用

on:
  schedule:
    # 毎日 JST 10:00 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      skip_ci_trigger:
        description: 'Skip triggering unified-ci and check last run instead'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: claude-ci-monitoring
  cancel-in-progress: false

jobs:
  # Job 1: unified-ci.ymlをトリガー
  trigger-unified-ci:
    name: Trigger Unified CI
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_ci_trigger != 'true'

    outputs:
      run_id: ${{ steps.trigger.outputs.run_id }}

    steps:
      - name: Trigger unified-ci workflow
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "Triggering unified-ci.yml workflow..."

          # unified-ci.ymlをトリガー
          gh workflow run unified-ci.yml --repo "$REPO" --ref main -f run_level=full

          # 少し待ってから実行IDを取得
          sleep 10

          RUN_ID=$(gh run list --repo "$REPO" --workflow=unified-ci.yml --branch=main --limit=1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered workflow run: $RUN_ID"

  # Job 2: unified-ciの完了を待機
  wait-for-ci:
    name: Wait for Unified CI
    runs-on: ubuntu-latest
    needs: trigger-unified-ci
    if: always()

    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
      run_id: ${{ steps.wait.outputs.run_id }}

    steps:
      - name: Wait for unified-ci to complete
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRIGGERED_RUN_ID: ${{ needs.trigger-unified-ci.outputs.run_id }}
          SKIP_TRIGGER: ${{ github.event.inputs.skip_ci_trigger }}
        run: |
          # トリガーをスキップした場合は最新の実行を取得
          if [ "$SKIP_TRIGGER" == "true" ] || [ -z "$TRIGGERED_RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$REPO" --workflow=unified-ci.yml --branch=main --limit=1 --json databaseId -q '.[0].databaseId')
          else
            RUN_ID="$TRIGGERED_RUN_ID"
          fi

          echo "Waiting for workflow run $RUN_ID to complete..."
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          # 最大60分待機（unified-ciは最大でも30分程度）
          MAX_WAIT=3600
          WAITED=0
          INTERVAL=30

          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(gh run view "$RUN_ID" --repo "$REPO" --json status,conclusion -q '.status')

            if [ "$STATUS" == "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion -q '.conclusion')
              echo "Workflow completed with conclusion: $CONCLUSION"
              echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Status: $STATUS, waiting..."
            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          echo "Timeout waiting for workflow"
          echo "conclusion=timeout" >> $GITHUB_OUTPUT

  # Job 3: 失敗時にPR作成
  create-fix-pr:
    name: Create Fix PR
    runs-on: ubuntu-latest
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.conclusion == 'failure'

    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      branch_name: ${{ steps.create-branch.outputs.branch_name }}

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SECRETS_ADMIN_PAT }}

      - name: Get failure logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.wait-for-ci.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching failure logs from run $RUN_ID..."

          # 失敗したジョブを特定
          FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs -q '.jobs[] | select(.conclusion == "failure") | .name')
          echo "Failed jobs: $FAILED_JOBS"

          # 失敗ログを取得
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > failure_logs.txt 2>/dev/null || echo "No logs available" > failure_logs.txt

          # ログを8000文字に制限
          LOGS=$(head -c 8000 failure_logs.txt)

          # 失敗タイプを判定
          FAILURE_TYPE="unknown"
          if echo "$FAILED_JOBS" | grep -qi "quick.*check\|typecheck\|lint"; then
            FAILURE_TYPE="typecheck_lint"
          elif echo "$FAILED_JOBS" | grep -qi "build"; then
            FAILURE_TYPE="build"
          elif echo "$FAILED_JOBS" | grep -qi "coverage\|unit\|test"; then
            FAILURE_TYPE="test"
          elif echo "$FAILED_JOBS" | grep -qi "e2e\|playwright"; then
            FAILURE_TYPE="e2e"
          elif echo "$FAILED_JOBS" | grep -qi "security"; then
            FAILURE_TYPE="security"
          fi

          echo "failure_type=$FAILURE_TYPE" >> $GITHUB_OUTPUT
          echo "failed_jobs<<EOF" >> $GITHUB_OUTPUT
          echo "$FAILED_JOBS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create fix branch
        id: create-branch
        run: |
          BRANCH_NAME="fix/ci-auto-fix-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create placeholder commit
        env:
          FAILURE_TYPE: ${{ steps.logs.outputs.failure_type }}
          FAILED_JOBS: ${{ steps.logs.outputs.failed_jobs }}
        run: |
          echo "CI Auto-Fix initiated at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ci-fix-marker
          echo "Failure type: $FAILURE_TYPE" >> .ci-fix-marker
          echo "Failed jobs: $FAILED_JOBS" >> .ci-fix-marker
          git add .ci-fix-marker
          git commit -m "chore: initiate CI auto-fix

          This branch was created automatically to fix CI failures detected on main.

          Failure type: $FAILURE_TYPE
          Failed jobs:
          $FAILED_JOBS

          Claude Code Action will analyze and fix these issues.

          🤖 Generated with Claude Code"

      - name: Push branch
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
        run: |
          git push -u origin "$BRANCH_NAME"

      - name: Create PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
          FAILURE_TYPE: ${{ steps.logs.outputs.failure_type }}
          FAILED_JOBS: ${{ steps.logs.outputs.failed_jobs }}
          RUN_ID: ${{ needs.wait-for-ci.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # 失敗ログを読み込み
          LOGS=""
          if [ -f "failure_logs.txt" ]; then
            LOGS=$(head -c 4000 failure_logs.txt)
          fi

          PR_BODY="## 🔧 CI Auto-Fix PR

          This PR was created automatically to fix CI failures detected by \`unified-ci.yml\` on the main branch.

          ### 📋 Failure Information
          - **Failure Type**: ${FAILURE_TYPE}
          - **Failed Workflow Run**: [#${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})

          ### ❌ Failed Jobs
          \`\`\`
          ${FAILED_JOBS}
          \`\`\`

          ### 📜 Error Logs (truncated)
          \`\`\`
          ${LOGS}
          \`\`\`

          ### 🤖 Next Steps
          Claude Code Action will be triggered to analyze and fix these issues.

          ---
          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          PR_URL=$(gh pr create \
            --title "fix: Auto-fix unified-ci failures on main" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME")

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Created PR #$PR_NUMBER"

  # Job 4: Claude Code Actionをトリガー
  trigger-claude-fix:
    name: Trigger Claude Fix
    runs-on: ubuntu-latest
    needs: [wait-for-ci, create-fix-pr]
    if: needs.wait-for-ci.outputs.conclusion == 'failure'

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Get failure details
        id: details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.wait-for-ci.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # 失敗ログを取得
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > failure_logs.txt 2>/dev/null || echo "No logs" > failure_logs.txt

          # 失敗したジョブ情報
          FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs -q '.jobs[] | select(.conclusion == "failure") | .name')

          echo "failed_jobs<<EOF" >> $GITHUB_OUTPUT
          echo "$FAILED_JOBS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Trigger Claude Code Action
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
          PR_NUMBER: ${{ needs.create-fix-pr.outputs.pr_number }}
          FAILED_JOBS: ${{ steps.details.outputs.failed_jobs }}
          RUN_ID: ${{ needs.wait-for-ci.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # 失敗ログを読み込み
          LOGS=""
          if [ -f "failure_logs.txt" ]; then
            LOGS=$(head -c 5000 failure_logs.txt)
          fi

          # Claude Code Actionをトリガーするコメント
          COMMENT_BODY="@claude

          ## 🔧 定期CI監視: unified-ci 失敗の自動修復依頼

          mainブランチの\`unified-ci.yml\`実行で問題が検出されました。完全自動で修復してください。

          ### 📋 失敗情報
          - **失敗したワークフロー**: [unified-ci.yml #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})
          - **失敗したジョブ**:
          \`\`\`
          ${FAILED_JOBS}
          \`\`\`

          ### 📜 エラーログ
          \`\`\`
          ${LOGS}
          \`\`\`

          ---

          ## 🎯 完全自動修復タスク

          ### Phase 1: 深掘り分析
          1. **エラーログを詳細に分析**
             - 失敗したジョブ: ${FAILED_JOBS}
             - エラーメッセージの特定
             - 失敗したファイル・行番号の特定

          2. **Task（サブエージェント）で調査**
             - \`subagent_type: Explore\` でコードベースを調査
             - 関連ファイルと依存関係を特定

          ### Phase 2: 修正実装
          3. **Edit/MultiEditで修正を適用**
             - 型エラー: 型定義の修正
             - Lintエラー: コードスタイルの修正
             - ビルドエラー: インポート/設定の修正
             - テストエラー: テストケースの修正

          4. **ローカル検証**
             \`\`\`bash
             npm ci
             npm run typecheck
             npm run lint
             npm run build
             \`\`\`

          ### Phase 3: コミット＆検証
          5. **修正をコミット**
             \`\`\`bash
             git add -A
             git commit -m \"fix: resolve unified-ci failures

             Failed jobs: ${FAILED_JOBS}
             Auto-fix by Claude Code Action

             🤖 Generated with Claude Code\"
             git push
             \`\`\`

          6. **CIパスを確認後、PRをApprove**
             \`\`\`bash
             gh pr review $PR_NUMBER --approve --body \"✅ unified-ci failures fixed and verified\"
             \`\`\`

          7. **PRをマージ**
             \`\`\`bash
             gh pr merge $PR_NUMBER --squash
             \`\`\`

          ---

          ## 📋 最終レポート
          修正完了後、以下の形式でレポートしてください：

          \`\`\`markdown
          ## 🤖 unified-ci 修復レポート

          ### 結果: ✅ 修正完了 / ❌ 修正失敗

          ### 修正内容
          | ファイル | 変更内容 |
          |----------|----------|
          | {ファイル名} | {変更の説明} |

          ### 検証結果
          - TypeScript: ✅/❌
          - Lint: ✅/❌
          - Build: ✅/❌

          ### PRステータス
          - [ ] 修正コミット完了
          - [ ] CI パス確認
          - [ ] PR Approve
          - [ ] PR マージ完了
          \`\`\`

          ## ⚠️ 重要
          - この修正はmainブランチに影響します
          - 破壊的な変更は避けてください
          - テストの期待値変更は慎重に行ってください
          "

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          echo "Triggered Claude Code Action for PR #$PR_NUMBER"

  # Job 5: 成功時の通知
  report-success:
    name: Report Success
    runs-on: ubuntu-latest
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.conclusion == 'success'

    steps:
      - name: Report all checks passed
        env:
          RUN_ID: ${{ needs.wait-for-ci.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "✅ unified-ci.yml passed on main branch"
          echo ""
          echo "Workflow run: https://github.com/$REPO/actions/runs/$RUN_ID"
          echo ""
          echo "No auto-fix needed."

  # Job 6: タイムアウト時の通知
  report-timeout:
    name: Report Timeout
    runs-on: ubuntu-latest
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.conclusion == 'timeout'

    steps:
      - name: Report timeout
        env:
          RUN_ID: ${{ needs.wait-for-ci.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "⚠️ Timeout waiting for unified-ci.yml to complete"
          echo ""
          echo "Workflow run: https://github.com/$REPO/actions/runs/$RUN_ID"
          echo ""
          echo "Please check the workflow manually."
