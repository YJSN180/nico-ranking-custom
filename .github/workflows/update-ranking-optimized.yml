name: Update Ranking (Optimized)

on:
  schedule:
    # 1日3回のみ実行（無料プラン制限を考慮）
    # JST: 6:00, 14:00, 22:00
    - cron: '0 21,5,13 * * *'  # UTC: 21:00, 5:00, 13:00
  workflow_dispatch:

# 同時実行を防ぐ
concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  # NGリスト取得
  fetch-ng-list:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Fetch NG List from KV
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_KV_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
      run: npx tsx scripts/fetch-ng-list.ts
    - uses: actions/upload-artifact@v4
      with:
        name: ng-list
        path: ng-list.json
        retention-days: 1

  # 並行データ取得
  fetch-rankings:
    needs: fetch-ng-list
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6]
      max-parallel: 6
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - uses: actions/download-artifact@v4
      with:
        name: ng-list
        path: ./
    - name: Fetch rankings for group ${{ matrix.group }}
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_KV_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
      run: npx tsx scripts/update-ranking-parallel-v2.ts --group ${{ matrix.group }} 6
    - uses: actions/upload-artifact@v4
      with:
        name: ranking-data-group-${{ matrix.group }}
        path: ./tmp/ranking-group-${{ matrix.group }}.json
        retention-days: 1

  # 最適化されたKV書き込み
  write-to-kv:
    needs: fetch-rankings
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: mkdir -p ./tmp
    - uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ranking-data-group-*
    - name: Aggregate and write with single attempt
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_KV_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
      run: |
        # ファイルを正しい位置に移動
        for dir in ./tmp/ranking-data-group-*; do
          if [ -d "$dir" ]; then
            mv "$dir"/*.json ./tmp/ 2>/dev/null || true
          fi
        done
        
        # 集約スクリプトを作成（リトライなし版）
        cat > ./scripts/aggregate-optimized.ts << 'EOF'
        #!/usr/bin/env npx tsx
        import 'dotenv/config'
        import * as fs from 'fs/promises'
        import * as path from 'path'
        
        async function writeToKV(data: any): Promise<void> {
          const CF_ACCOUNT_ID = process.env.CLOUDFLARE_ACCOUNT_ID;
          const CF_NAMESPACE_ID = process.env.CLOUDFLARE_KV_NAMESPACE_ID;
          const CF_API_TOKEN = process.env.CLOUDFLARE_KV_API_TOKEN;
        
          if (!CF_ACCOUNT_ID || !CF_NAMESPACE_ID || !CF_API_TOKEN) {
            throw new Error("Cloudflare KV credentials not configured");
          }
        
          const pako = await import('pako');
          const compressed = pako.gzip(JSON.stringify(data));
          console.log(`Compressed size: ${Math.round(compressed.length / 1024)}KB`);
        
          const url = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_NAMESPACE_ID}/values/RANKING_LATEST`;
        
          // 単一試行のみ（リトライなし）
          const response = await fetch(url, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${CF_API_TOKEN}`,
              "Content-Type": "application/octet-stream",
            },
            body: compressed,
          });
        
          if (!response.ok) {
            const error = await response.text();
            console.error(`KV write failed: ${response.status} - ${error}`);
            // 失敗してもワークフローは続行
            return;
          }
        
          console.log('KV write successful!');
          
          // メタデータ更新（ベストエフォート）
          try {
            await fetch(`${url.replace('/values/', '/metadata/')}`, {
              method: "PUT",
              headers: {
                "Authorization": `Bearer ${CF_API_TOKEN}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                compressed: true,
                updatedAt: new Date().toISOString(),
                version: 1,
              }),
            });
          } catch (e) {
            console.log('Metadata update failed (non-critical)');
          }
        }
        
        async function main() {
          const tmpDir = './tmp';
          const files = await fs.readdir(tmpDir);
          const groupFiles = files.filter(f => f.startsWith('ranking-group-') && f.endsWith('.json'));
          
          console.log(`Found ${groupFiles.length} group files`);
          
          const rankingData: any = {
            genres: {},
            metadata: {
              version: 1,
              updatedAt: new Date().toISOString(),
              totalItems: 0,
              ngFiltered: true
            }
          };
          
          let totalItems = 0;
          
          for (const file of groupFiles) {
            const content = await fs.readFile(path.join(tmpDir, file), 'utf-8');
            const results = JSON.parse(content);
            
            for (const result of results) {
              if (result?.genre && result?.data) {
                rankingData.genres[result.genre] = result.data;
                totalItems += (result.data['24h']?.items?.length || 0) + (result.data['hour']?.items?.length || 0);
              }
            }
          }
          
          rankingData.metadata.totalItems = totalItems;
          console.log(`Aggregated ${Object.keys(rankingData.genres).length} genres with ${totalItems} items`);
          
          // バックアップ保存
          await fs.writeFile('./tmp/latest-ranking.json', JSON.stringify(rankingData, null, 2));
          console.log('Saved backup to ./tmp/latest-ranking.json');
          
          // KV書き込み（単一試行）
          await writeToKV(rankingData);
        }
        
        main().catch(console.error);
        EOF
        
        chmod +x ./scripts/aggregate-optimized.ts
        npx tsx ./scripts/aggregate-optimized.ts
    
    - name: Upload backup data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latest-ranking-backup
        path: ./tmp/latest-ranking.json
        retention-days: 7