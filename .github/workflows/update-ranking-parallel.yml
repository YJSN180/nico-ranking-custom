name: Update Nico Ranking Data (Parallel)
# Last updated: 2025-07-02 to reactivate cron scheduler - retry fix

on:
  schedule:
    # Run at 0, 20, and 40 minutes past every hour (JST: 日本時間の毎時0分・20分・40分)
    # GitHub Actions uses UTC, so JST-9 hours
    # UTC 15:00,15:20,15:40 = JST 00:00,00:20,00:40 (翌日)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allow manual trigger

# 同時実行を防ぐ
concurrency:
  group: update-ranking
  cancel-in-progress: false
  
jobs:
  # Step 0: Fetch NG list job is no longer needed
  # Each parallel job will fetch fresh NG list from KV directly
  
  # Step 1: Fetch rankings in parallel groups
  fetch-rankings:
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch, not on push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
      max-parallel: 8
      fail-fast: false # Continue other groups even if one fails
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Fetch rankings for group ${{ matrix.group }}
      env:
        # Cloudflare KV credentials - EXACTLY THE SAME AS ORIGINAL
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Add KV Namespace ID fallback
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
        # Tag fetching configuration
        ENABLE_TAG_FETCHING: ${{ secrets.ENABLE_TAG_FETCHING || 'true' }}
        TAG_FETCH_MAX_VIDEOS: ${{ secrets.TAG_FETCH_MAX_VIDEOS || '1000' }}
        TAG_FETCH_GENRES: ''
        TAG_FETCH_FOR_TAG_RANKINGS: ${{ secrets.TAG_FETCH_FOR_TAG_RANKINGS || 'true' }}
      run: |
        echo "Starting group ${{ matrix.group }} at $(date)"
        # Debug: Check if environment variables are set
        echo "Debug: Checking environment variables..."
        echo "CLOUDFLARE_ACCOUNT_ID is set: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo 'YES' || echo 'NO')"
        echo "CLOUDFLARE_KV_NAMESPACE_ID is set: $([ -n "$CLOUDFLARE_KV_NAMESPACE_ID" ] && echo 'YES' || echo 'NO')"
        echo "CLOUDFLARE_API_TOKEN is set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo 'YES' || echo 'NO')"
        echo "ENABLE_TAG_FETCHING: $ENABLE_TAG_FETCHING"
        echo "TAG_FETCH_MAX_VIDEOS: $TAG_FETCH_MAX_VIDEOS"
        echo "TAG_FETCH_GENRES: $TAG_FETCH_GENRES"
        echo "TAG_FETCH_FOR_TAG_RANKINGS: $TAG_FETCH_FOR_TAG_RANKINGS"
        
        # Use fallback if KV_NAMESPACE_ID is not set
        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
          echo "Using fallback KV namespace ID"
        fi
        
        # Use improved version with better error handling and retry logic
        npx tsx scripts/update-ranking-parallel-v2.ts --group ${{ matrix.group }} 8
    
    - name: Upload partial results
      uses: actions/upload-artifact@v4
      with:
        name: ranking-data-group-${{ matrix.group }}
        path: ./tmp/ranking-group-${{ matrix.group }}.json
        retention-days: 1
        if-no-files-found: error
    
    - name: Upload NG derived results (if exists)
      uses: actions/upload-artifact@v4
      with:
        name: ng-derived-group-${{ matrix.group }}
        path: ./tmp/ng-derived-group-${{ matrix.group }}.json
        retention-days: 1
        if-no-files-found: ignore

  # Step 2: Aggregate results and write to KV
  aggregate-and-write:
    needs: fetch-rankings
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch, and if fetch-rankings completed
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create temp directory
      run: mkdir -p ./tmp
    
    - name: Download ranking artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ranking-data-group-*
    
    - name: Download NG derived artifacts (if exists)
      uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ng-derived-group-*
      continue-on-error: true
    
    - name: List downloaded files
      run: |
        echo "Downloaded artifacts:"
        ls -la ./tmp/
        echo "Complete directory structure:"
        find ./tmp -type f -name "*.json" | sort
        echo "Ranking files:"
        find ./tmp -name "ranking-group-*.json" | sort
        echo "NG derived files:"
        find ./tmp -name "ng-derived-group-*.json" | sort
    
    - name: Move files to correct location
      run: |
        # GitHub Actions creates subdirectories for each artifact
        # First, show the structure
        echo "Directory structure before moving:"
        find ./tmp -type f -name "*.json" | sort
        
        # Move all JSON files to the tmp directory root
        # Use a more robust approach that handles nested directories
        for file in $(find ./tmp -type f -name "*.json" | grep -v "^./tmp/[^/]*\.json$"); do
          echo "Moving: $file"
          mv "$file" ./tmp/ 2>/dev/null || echo "Failed to move: $file"
        done
        
        echo ""
        echo "Files after moving:"
        ls -la ./tmp/ranking-group-*.json 2>/dev/null || echo "No ranking group files found"
        echo ""
        echo "Total ranking group files found: $(ls ./tmp/ranking-group-*.json 2>/dev/null | wc -l)"
        echo "Total NG derived files found: $(ls ./tmp/ng-derived-group-*.json 2>/dev/null | wc -l)"
        echo "NG derived files after moving:"
        ls -la ./tmp/ng-derived-group-*.json 2>/dev/null || echo "No NG derived files found after moving"
    
    - name: Aggregate and write to KV
      env:
        # Cloudflare KV credentials - EXACTLY THE SAME AS ORIGINAL
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Add KV Namespace ID fallback
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
      run: |
        echo "Aggregating results and writing to KV..."
        echo "Expected 8 group files, found $(ls ./tmp/ranking-group-*.json 2>/dev/null | wc -l)"
        
        # Use fallback if KV_NAMESPACE_ID is not set
        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
          echo "Using fallback KV namespace ID"
        fi
        
        npx tsx scripts/aggregate-ranking-results-direct.ts
    
    - name: Write to R2
      if: success()
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "📤 Uploading to R2..."
        npx tsx scripts/write-to-r2.ts
    
    - name: Report completion
      run: |
        echo "✅ Ranking update completed at $(date)"
        echo "Check the logs above for details on processing time and item counts."