name: Update Nico Ranking Data (Parallel)
# Last updated: 2026-01-24 - 6グループ分散処理でgetthumbinfo APIレート制限対策

on:
  schedule:
    # 6つのグループを10分間隔で順番に更新（レート制限対策）
    # Group 1: 毎時05分 - all, game, anime, vocaloid (4ジャンル)
    # Group 2: 毎時15分 - voicesynthesis, entertainment, music, sing (4ジャンル)
    # Group 3: 毎時25分 - dance, play, commentary, cooking (4ジャンル)
    # Group 4: 毎時35分 - travel, nature, vehicle, technology (4ジャンル)
    # Group 5: 毎時45分 - society, mmd, vtuber, radio (4ジャンル)
    # Group 6: 毎時55分 - sports, animal, other (3ジャンル)
    - cron: '5 * * * *'   # Group 1
    - cron: '15 * * * *'  # Group 2
    - cron: '25 * * * *'  # Group 3
    - cron: '35 * * * *'  # Group 4
    - cron: '45 * * * *'  # Group 5
    - cron: '55 * * * *'  # Group 6
  workflow_dispatch:
    inputs:
      kv_group:
        description: 'KV Group to update (1-6, or ALL)'
        required: false
        default: 'ALL'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - 'ALL'

# 同時実行を防ぐ
concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  # Step 0: Determine which KV group to run
  determine-kv-group:
    runs-on: ubuntu-latest
    outputs:
      kv_group: ${{ steps.calc.outputs.kv_group }}
      genres: ${{ steps.calc.outputs.genres }}
    steps:
      - name: Calculate KV group
        id: calc
        run: |
          # 6グループに分散（レート制限対策: 各グループ3-4ジャンル）
          KV_GROUP_1_GENRES="all,game,anime,vocaloid"
          KV_GROUP_2_GENRES="voicesynthesis,entertainment,music,sing"
          KV_GROUP_3_GENRES="dance,play,commentary,cooking"
          KV_GROUP_4_GENRES="travel,nature,vehicle,technology"
          KV_GROUP_5_GENRES="society,mmd,vtuber,radio"
          KV_GROUP_6_GENRES="sports,animal,other"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 手動トリガーの場合はinputを使用
            KV_GROUP="${{ github.event.inputs.kv_group }}"
            if [[ "$KV_GROUP" == "ALL" ]]; then
              echo "kv_group=ALL" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_1_GENRES,$KV_GROUP_2_GENRES,$KV_GROUP_3_GENRES,$KV_GROUP_4_GENRES,$KV_GROUP_5_GENRES,$KV_GROUP_6_GENRES" >> $GITHUB_OUTPUT
              echo "Manual trigger: Running ALL KV groups"
            else
              echo "kv_group=$KV_GROUP" >> $GITHUB_OUTPUT
              case "$KV_GROUP" in
                1) echo "genres=$KV_GROUP_1_GENRES" >> $GITHUB_OUTPUT ;;
                2) echo "genres=$KV_GROUP_2_GENRES" >> $GITHUB_OUTPUT ;;
                3) echo "genres=$KV_GROUP_3_GENRES" >> $GITHUB_OUTPUT ;;
                4) echo "genres=$KV_GROUP_4_GENRES" >> $GITHUB_OUTPUT ;;
                5) echo "genres=$KV_GROUP_5_GENRES" >> $GITHUB_OUTPUT ;;
                6) echo "genres=$KV_GROUP_6_GENRES" >> $GITHUB_OUTPUT ;;
              esac
              echo "Manual trigger: Running KV Group $KV_GROUP"
            fi
          else
            # スケジュールトリガーの場合は時刻から判定（10分間隔）
            CURRENT_MINUTE=$(date -u '+%M')
            echo "Current UTC minute: $CURRENT_MINUTE"

            # 05分台 → Group 1, 15分台 → Group 2, ... 55分台 → Group 6
            if [[ "$CURRENT_MINUTE" -ge 0 && "$CURRENT_MINUTE" -le 9 ]]; then
              echo "kv_group=1" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_1_GENRES" >> $GITHUB_OUTPUT
              echo "Schedule trigger: Running KV Group 1 (4 genres: all,game,anime,vocaloid)"
            elif [[ "$CURRENT_MINUTE" -ge 10 && "$CURRENT_MINUTE" -le 19 ]]; then
              echo "kv_group=2" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_2_GENRES" >> $GITHUB_OUTPUT
              echo "Schedule trigger: Running KV Group 2 (4 genres: voicesynthesis,entertainment,music,sing)"
            elif [[ "$CURRENT_MINUTE" -ge 20 && "$CURRENT_MINUTE" -le 29 ]]; then
              echo "kv_group=3" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_3_GENRES" >> $GITHUB_OUTPUT
              echo "Schedule trigger: Running KV Group 3 (4 genres: dance,play,commentary,cooking)"
            elif [[ "$CURRENT_MINUTE" -ge 30 && "$CURRENT_MINUTE" -le 39 ]]; then
              echo "kv_group=4" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_4_GENRES" >> $GITHUB_OUTPUT
              echo "Schedule trigger: Running KV Group 4 (4 genres: travel,nature,vehicle,technology)"
            elif [[ "$CURRENT_MINUTE" -ge 40 && "$CURRENT_MINUTE" -le 49 ]]; then
              echo "kv_group=5" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_5_GENRES" >> $GITHUB_OUTPUT
              echo "Schedule trigger: Running KV Group 5 (4 genres: society,mmd,vtuber,radio)"
            else
              echo "kv_group=6" >> $GITHUB_OUTPUT
              echo "genres=$KV_GROUP_6_GENRES" >> $GITHUB_OUTPUT
              echo "Schedule trigger: Running KV Group 6 (3 genres: sports,animal,other)"
            fi
          fi

  # Step 1: Fetch rankings for target KV group
  fetch-rankings:
    needs: determine-kv-group
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kv_group: [1, 2, 3, 4, 5, 6]
      max-parallel: 6
      fail-fast: false

    steps:
    - name: Check if this KV group should run
      id: should_run
      run: |
        TARGET_KV_GROUP="${{ needs.determine-kv-group.outputs.kv_group }}"
        CURRENT_KV_GROUP="${{ matrix.kv_group }}"

        if [[ "$TARGET_KV_GROUP" == "ALL" || "$TARGET_KV_GROUP" == "$CURRENT_KV_GROUP" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "KV Group $CURRENT_KV_GROUP will run (target: $TARGET_KV_GROUP)"
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
          echo "Skipping KV Group $CURRENT_KV_GROUP (target: $TARGET_KV_GROUP)"
        fi

    - name: Checkout repository
      if: steps.should_run.outputs.should_run == 'true'
      uses: actions/checkout@v4

    - name: Setup Node.js
      if: steps.should_run.outputs.should_run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      if: steps.should_run.outputs.should_run == 'true'
      run: npm ci

    - name: Fetch rankings for KV Group ${{ matrix.kv_group }}
      if: steps.should_run.outputs.should_run == 'true'
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
        ENABLE_TAG_FETCHING: ${{ secrets.ENABLE_TAG_FETCHING || 'true' }}
        TAG_FETCH_MAX_VIDEOS: ${{ secrets.TAG_FETCH_MAX_VIDEOS || '1000' }}
        TAG_FETCH_GENRES: ''
        TAG_FETCH_FOR_TAG_RANKINGS: ${{ secrets.TAG_FETCH_FOR_TAG_RANKINGS || 'true' }}
      run: |
        echo "Starting KV Group ${{ matrix.kv_group }} at $(date)"
        echo "Target KV Group: ${{ needs.determine-kv-group.outputs.kv_group }}"

        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
          echo "Using fallback KV namespace ID"
        fi

        # Use KV group mode (--kv-group) instead of custom groups
        npx tsx scripts/update-ranking-parallel-v2.ts --kv-group ${{ matrix.kv_group }}

    - name: Upload partial results
      if: steps.should_run.outputs.should_run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ranking-data-kv-group-${{ matrix.kv_group }}
        path: ./tmp/ranking-kv-group-${{ matrix.kv_group }}.json
        retention-days: 1
        if-no-files-found: error

    - name: Upload NG derived results (if exists)
      if: steps.should_run.outputs.should_run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ng-derived-kv-group-${{ matrix.kv_group }}
        path: ./tmp/ng-derived-kv-group-${{ matrix.kv_group }}.json
        retention-days: 1
        if-no-files-found: ignore

    - name: Create placeholder for skipped KV group
      if: steps.should_run.outputs.should_run == 'false'
      run: |
        echo "KV Group ${{ matrix.kv_group }} skipped in this rotation"

  # Step 2: Aggregate results and write to KV
  aggregate-and-write:
    needs: [determine-kv-group, fetch-rankings]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create temp directory
      run: mkdir -p ./tmp

    - name: Download ranking artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ranking-data-kv-group-*
      continue-on-error: true

    - name: Download NG derived artifacts (if exists)
      uses: actions/download-artifact@v4
      with:
        path: ./tmp
        pattern: ng-derived-kv-group-*
      continue-on-error: true

    - name: List downloaded files
      run: |
        echo "KV Group: ${{ needs.determine-kv-group.outputs.kv_group }}"
        echo "Genres: ${{ needs.determine-kv-group.outputs.genres }}"
        echo ""
        echo "Downloaded artifacts:"
        ls -la ./tmp/ 2>/dev/null || echo "No tmp directory"
        echo ""
        echo "Ranking files:"
        find ./tmp -name "ranking-kv-group-*.json" 2>/dev/null | sort || echo "No ranking files found"

    - name: Move files to correct location
      run: |
        for file in $(find ./tmp -type f -name "*.json" | grep -v "^./tmp/[^/]*\.json$"); do
          echo "Moving: $file"
          mv "$file" ./tmp/ 2>/dev/null || echo "Failed to move: $file"
        done

        echo ""
        echo "Files after moving:"
        ls -la ./tmp/*.json 2>/dev/null || echo "No JSON files found"

    - name: Aggregate and write to KV
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
        KV_GROUP_MODE: "true"
      run: |
        echo "Aggregating results for KV Group: ${{ needs.determine-kv-group.outputs.kv_group }}"

        FOUND_FILES=$(ls ./tmp/ranking-kv-group-*.json 2>/dev/null | wc -l)
        echo "Found $FOUND_FILES KV group files"

        if [ "$FOUND_FILES" -eq 0 ]; then
          echo "⚠️ No ranking files found, skipping aggregation"
          exit 0
        fi

        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
          echo "Using fallback KV namespace ID"
        fi

        npx tsx scripts/aggregate-ranking-results-direct.ts

    - name: Accumulate tags for autocomplete
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK: "80f4535c379b4e8cb89ce6dbdb7d2dc9"
      run: |
        echo "🏷️  Accumulating tags for autocomplete functionality..."

        if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
          export CLOUDFLARE_KV_NAMESPACE_ID="$CLOUDFLARE_KV_NAMESPACE_ID_FALLBACK"
        fi

        npx tsx scripts/accumulate-tags.ts

    - name: Write to R2
      if: success()
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "📤 Uploading to R2..."
        npx tsx scripts/write-to-r2.ts

    - name: Report completion
      run: |
        echo "✅ Ranking update completed at $(date)"
        echo "KV Group: ${{ needs.determine-kv-group.outputs.kv_group }}"
        echo "Genres: ${{ needs.determine-kv-group.outputs.genres }}"
