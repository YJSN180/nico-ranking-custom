name: Update Nico Ranking Data (Parallel)
run-name: Ranking ${{ inputs.slot || github.run_id }}

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'UTC hourly slot supplied by the scheduler; blank for manual runs'
        type: string
      resume_run_id:
        description: 'Optional trusted main run with a validated-publication artifact (max age 120 minutes)'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: update-ranking
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID || '80f4535c379b4e8cb89ce6dbdb7d2dc9' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: nico-ranking

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.RANKING_EXTERNAL_SCHEDULER_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.guard.outputs.slot }}
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RANKING_SLOT: ${{ inputs.slot }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: npx tsx scripts/prepare-ranking-run.ts

  fetch-rankings:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
      max-parallel: 8
      fail-fast: false
    env:
      RANKING_SLOT: ${{ needs.prepare.outputs.slot }}
      ENABLE_TAG_FETCHING: ${{ secrets.ENABLE_TAG_FETCHING || 'true' }}
      TAG_FETCH_MAX_VIDEOS: ${{ secrets.TAG_FETCH_MAX_VIDEOS || '1000' }}
      TAG_FETCH_GENRES: ''
      TAG_FETCH_FOR_TAG_RANKINGS: ${{ secrets.TAG_FETCH_FOR_TAG_RANKINGS || 'true' }}
      TAG_CACHE_BACKEND: r2-aggregate
      TAG_CACHE_R2_PREFIX: tag-cache/v1
      TAG_FETCH_NICOLOG_CONCURRENCY: ${{ secrets.TAG_FETCH_NICOLOG_CONCURRENCY || '2' }}
      TAG_FETCH_NICOLOG_MIN_INTERVAL_MS: ${{ secrets.TAG_FETCH_NICOLOG_MIN_INTERVAL_MS || '500' }}
      TAG_FETCH_GETTHUMB_CONCURRENCY: ${{ secrets.TAG_FETCH_GETTHUMB_CONCURRENCY || '10' }}
      TAG_FETCH_GETTHUMB_MIN_INTERVAL_MS: ${{ secrets.TAG_FETCH_GETTHUMB_MIN_INTERVAL_MS || '150' }}
      TAG_FETCH_NICOLOG_TIMEOUT_MS: ${{ secrets.TAG_FETCH_NICOLOG_TIMEOUT_MS || '8000' }}
      TAG_FETCH_GETTHUMB_TIMEOUT_MS: ${{ secrets.TAG_FETCH_GETTHUMB_TIMEOUT_MS || '5000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Collect complete group
        run: npx tsx scripts/update-ranking-parallel-v2.ts --group ${{ matrix.group }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-data-group-${{ matrix.group }}
          path: ./tmp/ranking-group-${{ matrix.group }}.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-auxiliary-group-${{ matrix.group }}
          path: |
            ./tmp/ng-derived-group-${{ matrix.group }}.json
            ./tmp/tag-cache-delta-group-${{ matrix.group }}.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  aggregate-and-write:
    needs: [prepare, fetch-rankings]
    if: always() && needs.prepare.outputs.should_run == 'true' && (needs.fetch-rankings.result == 'success' || (inputs.resume_run_id != '' && needs.prepare.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RANKING_GENERATIONS_ENABLED: ${{ vars.RANKING_GENERATIONS_ENABLED || 'false' }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id == ''
        with:
          pattern: ranking-*-group-*
          path: ./tmp
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          name: validated-publication
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ./tmp
      - name: Validate all groups and aggregate
        if: inputs.resume_run_id == ''
        run: npx tsx scripts/aggregate-ranking-results-direct.ts
      - name: Preserve validated publication before any remote writes
        uses: actions/upload-artifact@v4
        with:
          name: validated-publication
          path: |
            ./tmp/latest-aggregated-data.json
            ./tmp/ng-derived-group-*.json
            ./tmp/tag-cache-delta-group-*.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - name: Accumulate autocomplete tags
        id: tags
        continue-on-error: true
        run: npx tsx scripts/accumulate-tags.ts
      - name: Publish ranking
        id: publish
        run: npx tsx scripts/write-to-r2.ts
      - name: Synchronize auxiliary KV copies and derived NG
        id: kv
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        run: npx tsx scripts/sync-ranking-auxiliary.ts
      - name: Merge tag cache
        id: cache
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          TAG_CACHE_R2_PREFIX: tag-cache/v1
        run: npx tsx scripts/merge-tag-cache-deltas-to-r2.ts ./tmp
      - name: Record auxiliary status
        if: always() && steps.publish.outcome == 'success'
        env:
          AUXILIARY_FAILED: ${{ steps.tags.outcome == 'failure' || steps.kv.outcome == 'failure' || steps.cache.outcome == 'failure' }}
        run: npx tsx scripts/record-pipeline-status.ts
      # 統計が追いつくまで最大12分待つので最後に置く（補助同期とタグキャッシュの統合を待たせない）
      - name: Verify published generation and stats
        id: verify
        if: always() && steps.publish.outcome == 'success'
        env:
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          VERIFY_OUTPUT_PATH: ./tmp/post-publish/verify-r2-contract.json
        run: npx tsx scripts/verify-r2-contract.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-publish-verification
          path: ./tmp/post-publish/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
