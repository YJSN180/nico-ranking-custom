name: Update Video Stats

on:
  schedule:
    # Run every 2 minutes for near real-time updates
    # 30 times per hour = 720 times per day (72% of free tier 1000 writes/day)
    # Ranking data writes have been stopped, so we can use more quota for video stats
    - cron: '*/2 * * * *'
  workflow_dispatch: # Allow manual trigger

# Prevent concurrent runs
concurrency:
  group: update-video-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update Video Stats in KV
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        CLOUDFLARE_KV_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: nico-ranking-data
      run: |
        echo "Starting video stats update..."
        npx tsx scripts/update-video-stats.ts
        echo "Video stats update completed"
        
    - name: Report failure
      if: failure()
      run: |
        echo "::error::Video stats update failed. Check logs for details."