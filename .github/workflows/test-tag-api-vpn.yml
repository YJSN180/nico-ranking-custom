name: Test Tag API with VPN (Japan IP)

on:
  workflow_dispatch:
    inputs:
      test_count:
        description: 'Number of videos to test (100, 500, 1000)'
        required: false
        default: '1000'

jobs:
  test-with-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # OpenVPNをインストール
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn

      # OpenVPN設定ファイルをデコード
      - name: Prepare OpenVPN config
        run: |
          echo "$OVPN_CONFIG" | base64 -d > /tmp/nordvpn-japan.ovpn
        env:
          OVPN_CONFIG: ${{ secrets.NORDVPN_OVPN_CONFIG }}

      # OpenVPN接続
      - name: Connect to NordVPN Japan
        uses: kota65535/github-openvpn-connect-action@v3
        with:
          config_file: /tmp/nordvpn-japan.ovpn
          username: ${{ secrets.NORDVPN_USERNAME }}
          password: ${{ secrets.NORDVPN_PASSWORD }}

      # IP確認
      - name: Check IP address
        run: |
          echo "=== Current IP Address ==="
          IP_INFO=$(curl -s https://ipinfo.io/json)
          echo "$IP_INFO" | jq .
          COUNTRY=$(echo "$IP_INFO" | jq -r .country)
          echo ""
          if [ "$COUNTRY" = "JP" ]; then
            echo "✅ Successfully connected to Japan IP"
          else
            echo "❌ Not connected to Japan IP (current: $COUNTRY)"
            exit 1
          fi

      # getthumbinfo 大規模テスト
      - name: Test getthumbinfo API at scale
        env:
          TEST_COUNT: ${{ github.event.inputs.test_count }}
        run: |
          npx tsx -e "
          const TARGET_COUNT = parseInt(process.env.TEST_COUNT || '1000', 10)
          const GENRES = ['all', 'game', 'anime', 'vocaloid', 'entertainment', 'music', 'sing', 'dance', 'play', 'other']

          async function fetchRankingPage(genre, page) {
            const response = await fetch(
              'https://www.nicovideo.jp/ranking/genre/' + genre + '?term=24h&page=' + page,
              {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
                  'Accept': 'text/html',
                  'Cookie': 'sensitive_material_status=accept'
                }
              }
            )
            const html = await response.text()
            const metaMatch = html.match(/<meta name=\"server-response\" content=\"([^\"]+)\"/)
            if (!metaMatch) return []
            const decoded = metaMatch[1].replace(/&quot;/g, '\"').replace(/&amp;/g, '&')
            const data = JSON.parse(decoded)
            const items = data.data?.response?.\$getTeibanRanking?.data?.items || []
            return items.map(item => item.id)
          }

          async function fetchVideoIds(targetCount) {
            const videoIds = new Set()

            for (const genre of GENRES) {
              if (videoIds.size >= targetCount) break

              for (let page = 1; page <= 10; page++) {
                if (videoIds.size >= targetCount) break

                console.log('取得中: ' + genre + ' page ' + page + ' (現在 ' + videoIds.size + '件)')
                const ids = await fetchRankingPage(genre, page)
                ids.forEach(id => videoIds.add(id))

                if (ids.length < 100) break  // これ以上ページがない
                await new Promise(r => setTimeout(r, 200))
              }
            }

            return Array.from(videoIds).slice(0, targetCount)
          }

          async function testGetThumbInfo(videoId) {
            try {
              const response = await fetch('https://ext.nicovideo.jp/api/getthumbinfo/' + videoId)
              if (response.status === 403) return { videoId, status: 403, tags: 0, rateLimited: true }
              if (!response.ok) return { videoId, status: response.status, tags: 0 }
              const xml = await response.text()
              if (xml.includes('status=\"fail\"')) return { videoId, status: 200, tags: 0, error: 'fail' }
              const tags = (xml.match(/<tag[^>]*>/g) || []).length
              return { videoId, status: 200, tags }
            } catch (e) {
              return { videoId, status: 0, tags: 0, error: e.message }
            }
          }

          async function main() {
            console.log('=== getthumbinfo レート制限テスト (' + TARGET_COUNT + '件) ===')
            console.log('')

            // 動画ID取得
            console.log('--- Phase 1: 動画ID取得 ---')
            const videoIds = await fetchVideoIds(TARGET_COUNT)
            console.log('取得完了: ' + videoIds.length + '件')
            console.log('')

            // getthumbinfo テスト
            console.log('--- Phase 2: getthumbinfo テスト ---')
            let success = 0, rateLimited = 0, failed = 0
            let firstRateLimitAt = null
            const startTime = Date.now()

            // 5並列、100ms間隔
            const PARALLEL = 5
            const DELAY = 100

            for (let i = 0; i < videoIds.length; i += PARALLEL) {
              const batch = videoIds.slice(i, i + PARALLEL)
              const results = await Promise.all(batch.map(testGetThumbInfo))

              for (const r of results) {
                if (r.rateLimited) {
                  rateLimited++
                  if (!firstRateLimitAt) {
                    firstRateLimitAt = i + 1
                    console.log('⚠️ 最初のレート制限発生: ' + (i + 1) + '件目')
                  }
                } else if (r.tags > 0) {
                  success++
                } else {
                  failed++
                }
              }

              // 進捗表示（10%ごと）
              const progress = Math.floor((i + PARALLEL) / videoIds.length * 10) * 10
              if ((i + PARALLEL) % Math.floor(videoIds.length / 10) < PARALLEL && progress > 0) {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1)
                console.log('進捗: ' + progress + '% (' + (i + PARALLEL) + '/' + videoIds.length + ') - 成功: ' + success + ', 403: ' + rateLimited + ' [' + elapsed + 's]')
              }

              if (i + PARALLEL < videoIds.length) {
                await new Promise(r => setTimeout(r, DELAY))
              }
            }

            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1)
            console.log('')
            console.log('=== 最終結果 ===')
            console.log('テスト件数: ' + videoIds.length)
            console.log('成功: ' + success + ' (' + Math.round(success/videoIds.length*100) + '%)')
            console.log('403 (レート制限): ' + rateLimited + ' (' + Math.round(rateLimited/videoIds.length*100) + '%)')
            console.log('その他失敗: ' + failed)
            console.log('処理時間: ' + elapsed + '秒')

            if (firstRateLimitAt) {
              console.log('')
              console.log('⚠️ レート制限開始位置: ' + firstRateLimitAt + '件目')
            }

            if (rateLimited === 0) {
              console.log('')
              console.log('✅ ' + videoIds.length + '件でレート制限なし！')
            }
          }

          main().catch(e => { console.error(e); process.exit(1) })
          "

      # 結果サマリー
      - name: Summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "VPN Connection: Japan IP" >> $GITHUB_STEP_SUMMARY
          echo "Test Count: ${{ github.event.inputs.test_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the test output above for detailed results." >> $GITHUB_STEP_SUMMARY
