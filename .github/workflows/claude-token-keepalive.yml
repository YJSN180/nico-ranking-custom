name: Claude Token Keepalive

# OAuthトークンを定期的に使用して、リフレッシュトークンの無効化を防ぐ
#
# 更新: 2025-12-13 - Claude Code Action不使用に変更（workflow_dispatch非対応のため）
#
# 動作:
# 1. 毎日実行でOAuthトークンを検証
# 2. アクセストークンが期限切れの場合、リフレッシュトークンで更新
# 3. リフレッシュ後、GitHub Secretsを自動更新
#
# これにより、リフレッシュトークンが「使用されている」状態を維持し、
# Anthropic側での無効化を防ぎます。

on:
  schedule:
    # 毎日JST 6:00 (UTC 21:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force token refresh even if not expired'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: claude-token-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Keep OAuth Token Alive
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Check token expiration and refresh if needed
        id: token_check
        env:
          ACCESS_TOKEN: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          EXPIRES_AT: ${{ secrets.CLAUDE_EXPIRES_AT }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          echo "=== Token Keepalive Check ==="

          # 現在時刻（ミリ秒）
          NOW=$(date +%s)000

          # 有効期限チェック
          if [ -z "$EXPIRES_AT" ]; then
            echo "⚠️ EXPIRES_AT not set"
            echo "needs_refresh=true" >> $GITHUB_OUTPUT
            echo "reason=expires_at_not_set" >> $GITHUB_OUTPUT
          elif [ "$FORCE_REFRESH" == "true" ]; then
            echo "🔄 Force refresh requested"
            echo "needs_refresh=true" >> $GITHUB_OUTPUT
            echo "reason=force_refresh" >> $GITHUB_OUTPUT
          elif [ "$EXPIRES_AT" -lt "$NOW" ]; then
            echo "⚠️ Token has expired"
            echo "needs_refresh=true" >> $GITHUB_OUTPUT
            echo "reason=expired" >> $GITHUB_OUTPUT
          else
            # 24時間以内に期限切れの場合も更新
            BUFFER=$((24 * 60 * 60 * 1000))
            THRESHOLD=$((NOW + BUFFER))
            if [ "$EXPIRES_AT" -lt "$THRESHOLD" ]; then
              echo "⚠️ Token expires within 24 hours, refreshing proactively"
              echo "needs_refresh=true" >> $GITHUB_OUTPUT
              echo "reason=expiring_soon" >> $GITHUB_OUTPUT
            else
              HOURS_LEFT=$(( (EXPIRES_AT - NOW) / 1000 / 60 / 60 ))
              echo "✅ Token is valid for $HOURS_LEFT more hours"
              echo "needs_refresh=false" >> $GITHUB_OUTPUT
              echo "hours_left=$HOURS_LEFT" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Refresh OAuth token
        id: refresh
        if: steps.token_check.outputs.needs_refresh == 'true'
        env:
          REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const { appendFileSync } = await import('node:fs')
          const output = (key, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`)
          const fail = (reason) => {
            output('success', 'false')
            output('error', reason)
            console.error(`OAuth refresh failed: ${reason}`)
          }
          const refreshToken = process.env.REFRESH_TOKEN
          if (!refreshToken) {
            fail('refresh_token_not_set')
          } else {
            // Retry only explicit rate limits. A network/5xx failure may have rotated
            // the token already, so blindly replaying that POST is unsafe.
            const deadline = Date.now() + 120_000
            for (let attempt = 1; attempt <= 3; attempt++) {
              let response
              try {
                response = await fetch('https://console.anthropic.com/v1/oauth/token', {
                  method: 'POST',
                  redirect: 'error',
                  signal: AbortSignal.timeout(30_000),
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    grant_type: 'refresh_token',
                    refresh_token: refreshToken,
                    client_id: '9d1c250a-e61b-44d9-88ed-5944d1962f5e',
                  }),
                })
                if (response.status === 429) {
                  const retryAfter = response.headers.get('retry-after')?.trim()
                  let delay = 10_000 * 2 ** (attempt - 1)
                  if (retryAfter) {
                    const date = Date.parse(retryAfter)
                    if (/^\d+$/.test(retryAfter)) delay = Number(retryAfter) * 1000
                    else if (Number.isFinite(date)) delay = Math.max(0, date - Date.now())
                  }
                  await response.body?.cancel()
                  // Do not shorten a server's Retry-After to fit our time budget.
                  if (attempt === 3 || delay + 30_000 > deadline - Date.now()) {
                    fail('rate_limited')
                    break
                  }
                  console.log(`OAuth rate limited; retry ${attempt + 1}/3 after ${delay}ms`)
                  await new Promise((resolve) => setTimeout(resolve, delay))
                  continue
                }
                if (response.status !== 200) {
                  await response.body?.cancel()
                  fail(`refresh_failed_${response.status}`)
                  break
                }
                const body = await response.json()
                const access = body.access_token
                const refresh = body.refresh_token ?? refreshToken
                const expiresIn = body.expires_in ?? 3600
                const validToken = (value) => typeof value === 'string' && value.length > 0 && !/[\r\n]/.test(value)
                if (!validToken(access) || !validToken(refresh) ||
                    !Number.isSafeInteger(expiresIn) || expiresIn <= 0 ||
                    !Number.isSafeInteger(Date.now() + expiresIn * 1000)) {
                  fail('invalid_refresh_response')
                  break
                }
                // Never log the provider response (including error bodies).
                const mask = (value) => console.log(`::add-mask::${value.replaceAll('%', '%25')}`)
                mask(access)
                mask(refresh)
                output('new_access_token', access)
                output('new_refresh_token', refresh)
                output('new_expires_at', Date.now() + expiresIn * 1000)
                output('success', 'true')
                console.log('OAuth token refreshed successfully')
                break
              } catch {
                // Do not emit exceptions: they can include the request or response.
                fail(response?.status === 200 ? 'invalid_refresh_response' : 'refresh_transport_error')
                break
              }
            }
          }
          NODE

      - name: Update GitHub Secrets
        if: steps.refresh.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
          REPO: ${{ github.repository }}
          NEW_ACCESS_TOKEN: ${{ steps.refresh.outputs.new_access_token }}
          NEW_REFRESH_TOKEN: ${{ steps.refresh.outputs.new_refresh_token }}
          NEW_EXPIRES_AT: ${{ steps.refresh.outputs.new_expires_at }}
        run: |
          echo "📝 Updating GitHub Secrets..."

          # Update secrets using gh CLI
          echo "$NEW_ACCESS_TOKEN" | gh secret set CLAUDE_ACCESS_TOKEN --repo "$REPO"
          echo "$NEW_REFRESH_TOKEN" | gh secret set CLAUDE_REFRESH_TOKEN --repo "$REPO"
          echo "$NEW_EXPIRES_AT" | gh secret set CLAUDE_EXPIRES_AT --repo "$REPO"

          echo "✅ Secrets updated successfully"

      - name: Report result
        env:
          NEEDS_REFRESH: ${{ steps.token_check.outputs.needs_refresh }}
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.success }}
          REFRESH_ERROR: ${{ steps.refresh.outputs.error }}
          HOURS_LEFT: ${{ steps.token_check.outputs.hours_left }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Keepalive Result ==="

          if [ "$NEEDS_REFRESH" != "true" ]; then
            echo "✅ Token is valid, no refresh needed"
            echo "Hours remaining: $HOURS_LEFT"
            exit 0
          fi

          if [ "$REFRESH_SUCCESS" == "true" ]; then
            echo "✅ Token refreshed and secrets updated"

            # 既存のoauth-token issueを閉じる
            EXISTING=$(gh issue list --repo "$REPO" --state open --label "oauth-token" --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$REPO" --comment "✅ OAuth token has been refreshed automatically by keepalive workflow."
              echo "Closed issue #$EXISTING"
            fi
            exit 0
          fi

          echo "❌ Token refresh failed: $REFRESH_ERROR"

          # A rate limit is not evidence that the refresh token is invalid.
          if [ "$REFRESH_ERROR" = "rate_limited" ]; then
            ACTION="The provider is rate limiting OAuth refresh. Bounded retries were exhausted or Retry-After exceeded the retry budget. Wait for the provider limit to clear before another run. Token validity is unknown; do not rotate credentials solely because of HTTP 429."
          elif [ "$REFRESH_ERROR" = "refresh_failed_400" ] || [ "$REFRESH_ERROR" = "refresh_failed_401" ] || [ "$REFRESH_ERROR" = "refresh_token_not_set" ]; then
            ACTION="Check the configured OAuth credentials and provider authentication status. If credentials are confirmed missing or invalid, an authorized maintainer must reauthenticate and update the GitHub Secrets."
          else
            ACTION="Check provider availability and the workflow failure category before retrying or changing credentials. A transport or malformed-response failure does not prove that credentials are invalid."
          fi

          # Preserve failure status and the existing issue deduplication.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label "oauth-token" --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING" ]; then
            BODY="## OAuth Token Refresh Failed

          The automatic token refresh failed with error: \`$REFRESH_ERROR\`

          ### Required Action
          $ACTION

          🤖 Auto-generated by token keepalive workflow."

            gh issue create \
              --repo "$REPO" \
              --title "🔑 Claude OAuth Token Refresh Failed" \
              --label "oauth-token,urgent" \
              --body "$BODY"
            echo "Created issue for OAuth refresh investigation"
          else
            echo "Issue #$EXISTING already exists"
          fi

          exit 1
