name: Claude Dependabot Trigger

# DependabotのPRに対して@claudeコメントを追加し、
# claude.ymlワークフローをトリガーする
#
# 注意: Dependabotは権限が制限されているため、2段階で処理する
# 1. このワークフロー: Dependabot PRに@claudeコメントを追加
# 2. claude.yml: コメントをトリガーとしてClaude Code Actionを実行

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同時実行を制御
concurrency:
  group: claude-dependabot-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  trigger-claude:
    # Dependabot PRの場合のみ実行
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add @claude comment to trigger review
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Adding @claude comment to trigger Claude Code Action..."

          # Claude Code Actionをトリガーするコメントを追加
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "@claude

          This is a Dependabot pull request for dependency updates.

          Please perform the following tasks:

          1. **Review the changes**: Analyze the dependency updates in this PR.
             - Check if the updated packages have any breaking changes
             - Review the changelog/release notes if available
             - Identify any potential security implications

          2. **Run tests**: Execute the test suite to verify compatibility.
             - Run \`npm run typecheck\` to check TypeScript types
             - Run \`npm run lint\` to check code style

          3. **Fix issues if needed**: If there are any type errors or lint errors:
             - Make necessary code adjustments to fix compatibility issues
             - Update type definitions if needed
             - Commit the fixes with a clear message

          4. **Provide a summary**: Give a brief summary of:
             - What packages were updated
             - Whether all checks passed
             - Any fixes that were applied
             - Whether this PR is safe to merge

          If all checks pass and no issues are found, indicate that the PR is ready for merge."

          echo "Comment added successfully!"
