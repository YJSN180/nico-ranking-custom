name: Vercel Cache Refresh

# Vercel CDNキャッシュを更新するためのワークフロー
# 問題: SSRで生成されたHTMLがVercel CDNにキャッシュされ、
# ページリロード時に古いデータ（PRマージ時点のデータ）が表示される
# 解決: Vercel CLIを使用して定期的に再デプロイを実行

on:
  schedule:
    # 毎日日本時間の6:00, 12:00, 18:00, 0:00に実行
    # UTC: 21:00, 3:00, 9:00, 15:00
    - cron: '0 21,3,9,15 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual cache refresh'

# 同時実行を防ぐ
concurrency:
  group: vercel-cache-refresh
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build Project Artifacts
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy to Vercel
      id: deploy
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "🔄 Deploying to Vercel to refresh CDN cache..."
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

        # Deploy with --prod flag
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1)
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "✅ Deployment completed: $DEPLOYMENT_URL"

        # Extract deployment ID from URL and ensure it's promoted to production
        # Wait for deployment to be ready
        sleep 10

        # Get the latest deployment ID we just created
        DEPLOYMENT_ID=$(curl -s -X GET \
          "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=5" \
          -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.deployments[0].uid')

        echo "📦 Deployment ID: $DEPLOYMENT_ID"

        # Explicitly promote to production using Vercel API
        echo "🚀 Promoting deployment to production..."
        PROMOTE_RESPONSE=$(curl -s -X POST \
          "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
          -H "Authorization: Bearer ${VERCEL_TOKEN}" \
          -H "Content-Type: application/json")

        echo "Promote response: $PROMOTE_RESPONSE"

        # Check if promotion was successful
        if echo "$PROMOTE_RESPONSE" | jq -e '.jobId' > /dev/null 2>&1; then
          echo "✅ Promotion initiated successfully!"
        else
          echo "⚠️ Promotion may have failed, checking deployment status..."
        fi

    - name: Wait for promotion
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "⏳ Waiting for production promotion to complete..."
        sleep 30

        # Verify the deployment is now production
        CURRENT_PROD=$(curl -s -X GET \
          "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1&target=production&state=READY" \
          -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.deployments[0].uid')

        echo "Current production deployment: $CURRENT_PROD"

    - name: Verify cache refresh
      run: |
        echo "🔍 Verifying cache refresh..."

        # Wait a bit for CDN propagation
        sleep 30

        # Check if the site returns fresh data
        RESPONSE=$(curl -s -I "https://nico-rank.com/" | head -20)

        echo "Response headers:"
        echo "$RESPONSE"

        # Check cache status
        if echo "$RESPONSE" | grep -qi "x-vercel-cache: HIT"; then
          echo "⚠️ Cache is still HIT - may need more time to propagate"
        else
          echo "✅ Cache appears to be refreshed"
        fi

        echo ""
        echo "🎉 Vercel cache refresh workflow completed!"
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
