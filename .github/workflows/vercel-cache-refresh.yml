name: Scheduled Redeploy

# Vercel CDNキャッシュを更新するためのワークフロー
#
# 統合: 旧 scheduled-redeploy.yml と vercel-cache-refresh.yml を統合
#
# 問題: SSRで生成されたHTMLがVercel CDNにキャッシュされ、
# ページリロード時に古いデータ（PRマージ時点のデータ）が表示される
# 解決: Vercel CLIを使用して定期的に再デプロイを実行

on:
  schedule:
    # 毎日日本時間の6:00, 12:00, 18:00, 0:00に実行
    # UTC: 21:00, 3:00, 9:00, 15:00
    - cron: '0 21,3,9,15 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual cache refresh'

# 同時実行を防ぐ
concurrency:
  group: scheduled-redeploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build Project Artifacts
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy to Vercel
      id: deploy
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        set +e  # Don't exit on error

        echo "🔄 Deploying to Vercel to refresh CDN cache..."
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

        # Deploy with --prod flag - output directly to see progress
        echo "Starting Vercel deploy..."
        vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        DEPLOY_EXIT_CODE=$?

        if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
          echo "⚠️ Deploy command exited with code $DEPLOY_EXIT_CODE"
          echo "Continuing to check deployment status..."
        fi

        echo "✅ Deploy command completed"

        # Wait for deployment to be ready
        echo "⏳ Waiting for deployment to be ready..."
        sleep 15

        # Get the latest deployment ID we just created
        echo "📋 Fetching latest deployment..."
        DEPLOYMENT_RESPONSE=$(curl -s -X GET \
          "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1&target=production" \
          -H "Authorization: Bearer ${VERCEL_TOKEN}")

        echo "Deployment API response: $DEPLOYMENT_RESPONSE"

        DEPLOYMENT_ID=$(echo "$DEPLOYMENT_RESPONSE" | jq -r '.deployments[0].uid')
        DEPLOYMENT_STATE=$(echo "$DEPLOYMENT_RESPONSE" | jq -r '.deployments[0].state')
        DEPLOYMENT_URL=$(echo "$DEPLOYMENT_RESPONSE" | jq -r '.deployments[0].url')

        echo "📦 Deployment ID: $DEPLOYMENT_ID"
        echo "📊 Deployment State: $DEPLOYMENT_STATE"
        echo "🔗 Deployment URL: $DEPLOYMENT_URL"

        echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

        # Check if deployment is already in production
        if [ "$DEPLOYMENT_STATE" = "READY" ]; then
          echo "✅ Deployment is already READY in production!"
        else
          echo "⏳ Deployment state is $DEPLOYMENT_STATE, waiting..."
          sleep 30
        fi

    - name: Verify production deployment
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "🔍 Verifying current production deployment..."

        # Verify the deployment is now production
        PROD_RESPONSE=$(curl -s -X GET \
          "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1&target=production&state=READY" \
          -H "Authorization: Bearer ${VERCEL_TOKEN}")

        CURRENT_PROD=$(echo "$PROD_RESPONSE" | jq -r '.deployments[0].uid')
        CURRENT_URL=$(echo "$PROD_RESPONSE" | jq -r '.deployments[0].url')
        CREATED_AT=$(echo "$PROD_RESPONSE" | jq -r '.deployments[0].createdAt')

        echo "Current production deployment: $CURRENT_PROD"
        echo "Current production URL: $CURRENT_URL"
        echo "Created at: $CREATED_AT"

        # Calculate age of deployment
        if [ -n "$CREATED_AT" ] && [ "$CREATED_AT" != "null" ]; then
          CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || echo "0")
          NOW_EPOCH=$(date +%s)
          AGE_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
          AGE_MINUTES=$((AGE_SECONDS / 60))
          echo "📊 Deployment age: ${AGE_MINUTES} minutes old"

          if [ $AGE_MINUTES -lt 5 ]; then
            echo "✅ Production deployment is fresh (< 5 minutes old)"
          else
            echo "⚠️ Production deployment is ${AGE_MINUTES} minutes old"
          fi
        fi

    - name: Verify cache refresh
      run: |
        echo "🔍 Verifying cache refresh..."

        # Wait a bit for CDN propagation
        sleep 30

        # Check if the site returns fresh data
        RESPONSE=$(curl -s -I "https://nico-rank.com/" | head -20)

        echo "Response headers:"
        echo "$RESPONSE"

        # Check cache status
        if echo "$RESPONSE" | grep -qi "x-vercel-cache: HIT"; then
          echo "⚠️ Cache is still HIT - may need more time to propagate"
        else
          echo "✅ Cache appears to be refreshed"
        fi

        echo ""
        echo "🎉 Vercel cache refresh workflow completed!"
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
