name: Slack Notification Example

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Option 1: Slack公式のGitHub Action（推奨）
      - name: Send Slack notification (Official)
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2Eテスト結果",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*E2Eテスト完了* :white_check_mark:\n結果: 成功"
                  }
                }
              ]
            }

      # Option 2: カスタムcurlコマンド
      - name: Send Slack notification (curl)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "E2Eモニタリング通知",
              "attachments": [{
                "color": "good",
                "title": "テスト成功",
                "fields": [
                  {"title": "ワークフロー", "value": "${{ github.workflow }}", "short": true},
                  {"title": "ブランチ", "value": "${{ github.ref }}", "short": true}
                ]
              }]
            }'