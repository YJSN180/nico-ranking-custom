name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check KV_RANKING_ID
      run: |
        echo "KV_RANKING_ID is set: ${{ secrets.KV_RANKING_ID != '' }}"
        echo "KV_RANKING_ID length: ${#KV_RANKING_ID}"
        echo "First 4 chars: ${KV_RANKING_ID:0:4}***"
        echo "Last 4 chars: ***${KV_RANKING_ID: -4}"
      env:
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        
    - name: Test all secrets
      run: |
        echo "=== Testing all secrets ==="
        for var in CLOUDFLARE_ACCOUNT_ID KV_RANKING_ID CLOUDFLARE_API_TOKEN CRON_SECRET WORKER_AUTH_KEY ADMIN_USERNAME ADMIN_PASSWORD; do
          val="${!var}"
          if [ -z "$val" ]; then
            echo "$var: EMPTY"
          else
            echo "$var: ${#val} chars"
          fi
        done
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}