name: LQNG Backfill

# 粗悪コンテンツ自動NG: 過去分のバックフィル（手動起動）
# Worker lqng-poller の /trigger?mode=backfill を繰り返し呼び、判定差分をまとめて受け箱
# （KV lqng:inbox:<runId>:<seq>）に置く。判定表への反映は次のポーリング（15 分ごと）が行う。
# 走査は KV を書かないため、KV の書き込みは確定の回数分（数回）だけ。
# 注意: workflow_dispatch は既定ブランチにこのファイルがあるときだけ起動できる。
# 駆動スクリプトと Worker のコードは ref 入力のブランチから取り出す。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '駆動スクリプトを取り出すブランチ（自動NG の実装があるブランチ）'
        required: false
        default: 'feature/site-improvements'
        type: string
      pages:
        description: '1 回の呼び出しで読む Snapshot ページ数（1〜8、100 件/ページ）'
        required: false
        default: '3'
        type: string
      max_calls:
        description: '最大呼び出し回数（上限に達したら途中終了。書き込み済みの判定は残る）'
        required: false
        default: '800'
        type: string
      days:
        description: '遡る日数（空欄で全履歴）'
        required: false
        default: ''
        type: string
      commit_every:
        description: '何回の呼び出しごとに判定差分を受け箱に置くか（途中で失敗しても、見つけた分は確定してから終わる）'
        required: false
        default: '40'
        type: string
      end:
        description: '走査の開始時点（ISO 日時、空欄で現在）。途中終了した続きはログの最後の窓の終端を指定する'
        required: false
        default: ''
        type: string
      source:
        description: '取得元。snapshot=全履歴（Snapshot API）、pages=本家タグページ（直近数日、Snapshot 未反映分の補完）'
        required: false
        default: 'snapshot'
        type: choice
        options:
          - snapshot
          - pages

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backfill driver
        env:
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          LQNG_WORKER_URL: https://lqng-poller.yjsn180180.workers.dev
          BACKFILL_PAGES: ${{ inputs.pages }}
          BACKFILL_MAX_CALLS: ${{ inputs.max_calls }}
          BACKFILL_DAYS: ${{ inputs.days }}
          BACKFILL_COMMIT_EVERY: ${{ inputs.commit_every }}
          BACKFILL_END: ${{ inputs.end }}
          BACKFILL_SOURCE: ${{ inputs.source }}
          # 受け箱のキー（lqng:inbox:<runId>:<seq>）に使う。再実行（attempt）ごとに別のキーになる
          LQNG_BACKFILL_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          # ジョブの上限（timeout-minutes: 180）で打ち切られる前に、見つけた差分を確定して終える
          BACKFILL_DEADLINE_MINUTES: '165'
        run: npx tsx scripts/lqng-backfill-driver.ts
