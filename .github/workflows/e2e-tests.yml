name: E2E Tests with Slack Notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every day at 9:00 AM JST (00:00 UTC)
    - cron: '0 0 * * *'
    # Run detailed tests every Monday at 6:00 PM JST (09:00 UTC)
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      test-result: ${{ steps.test-execution.outputs.result }}
      test-summary: ${{ steps.test-summary.outputs.summary }}
      failed-tests: ${{ steps.test-summary.outputs.failed-tests }}

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}

    - name: Build application
      run: npm run build
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

    - name: Start dev server
      run: |
        npm run dev &
        npx wait-on http://localhost:3000 --timeout 120000
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    - name: Run E2E tests
      id: test-execution
      run: |
        set +e
        npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        TEST_EXIT_CODE=$?
        
        if [ $TEST_EXIT_CODE -eq 0 ]; then
          echo "result=success" >> $GITHUB_OUTPUT
        else
          echo "result=failure" >> $GITHUB_OUTPUT
        fi
        
        exit $TEST_EXIT_CODE
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000
        CI: true
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        NODE_ENV: test

    - name: Generate test summary
      id: test-summary
      if: always()
      run: |
        if [ -f "playwright-report/results.json" ]; then
          TOTAL_TESTS=$(jq -r '.suites | map(.specs | length) | add // 0' playwright-report/results.json)
          PASSED_TESTS=$(jq -r '.suites | map(.specs | map(select(.tests[0].results[0].status == "passed")) | length) | add // 0' playwright-report/results.json)
          FAILED_TESTS=$(jq -r '.suites | map(.specs | map(select(.tests[0].results[0].status == "failed")) | length) | add // 0' playwright-report/results.json)
          SKIPPED_TESTS=$(jq -r '.suites | map(.specs | map(select(.tests[0].results[0].status == "skipped")) | length) | add // 0' playwright-report/results.json)
          
          # Get failed test names
          FAILED_TEST_NAMES=$(jq -r '.suites[].specs[] | select(.tests[0].results[0].status == "failed") | .title' playwright-report/results.json | head -5 | paste -sd "," -)
        else
          TOTAL_TESTS="0"
          PASSED_TESTS="0" 
          FAILED_TESTS="0"
          SKIPPED_TESTS="0"
          FAILED_TEST_NAMES=""
        fi
        
        SUMMARY="Total: $TOTAL_TESTS, Passed: $PASSED_TESTS, Failed: $FAILED_TESTS, Skipped: $SKIPPED_TESTS"
        echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
        echo "failed-tests=$FAILED_TEST_NAMES" >> $GITHUB_OUTPUT

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() && (failure() || success())
      with:
        name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload test videos
      uses: actions/upload-artifact@v4
      if: always() && (failure() || success())
      with:
        name: test-videos-${{ matrix.browser }}-${{ matrix.shard }}
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [e2e-tests, merge-reports, lighthouse, accessibility]
    if: always()
    
    steps:
      - name: Determine overall result
        id: overall-result
        run: |
          E2E_RESULT="${{ needs.e2e-tests.result }}"
          LIGHTHOUSE_RESULT="${{ needs.lighthouse.result }}"
          ACCESSIBILITY_RESULT="${{ needs.accessibility.result }}"
          
          if [[ "$E2E_RESULT" == "success" && "$LIGHTHOUSE_RESULT" == "success" && "$ACCESSIBILITY_RESULT" == "success" ]]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          elif [[ "$E2E_RESULT" == "cancelled" || "$LIGHTHOUSE_RESULT" == "cancelled" || "$ACCESSIBILITY_RESULT" == "cancelled" ]]; then
            echo "result=cancelled" >> $GITHUB_OUTPUT
            echo "status_emoji=⏹️" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.overall-result.outputs.result }}
          custom_payload: |
            {
              "channel": "#nico-ranking-alerts",
              "username": "E2E Test Bot",
              "icon_emoji": ":robot_face:",
              "attachments": [
                {
                  "color": "${{ steps.overall-result.outputs.color }}",
                  "title": "${{ steps.overall-result.outputs.status_emoji }} E2E Test Results - ${{ github.repository }}",
                  "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "fields": [
                    {
                      "title": "Overall Status",
                      "value": "${{ steps.overall-result.outputs.result == 'success' && 'All tests passed' || steps.overall-result.outputs.result == 'cancelled' && 'Tests cancelled' || 'Some tests failed' }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Trigger",
                      "value": "${{ github.event_name == 'schedule' && 'Scheduled' || github.event_name == 'workflow_dispatch' && 'Manual' || github.event_name }}",
                      "short": true
                    },
                    {
                      "title": "Test Summary",
                      "value": "${{ needs.e2e-tests.outputs.test-summary || 'No summary available' }}",
                      "short": true
                    },
                    {
                      "title": "E2E Tests",
                      "value": "${{ needs.e2e-tests.result == 'success' && '✅ Passed' || needs.e2e-tests.result == 'cancelled' && '⏹️ Cancelled' || '❌ Failed' }}",
                      "short": true
                    },
                    {
                      "title": "Lighthouse",
                      "value": "${{ needs.lighthouse.result == 'success' && '✅ Passed' || needs.lighthouse.result == 'cancelled' && '⏹️ Cancelled' || '❌ Failed' }}",
                      "short": true
                    },
                    {
                      "title": "Accessibility",
                      "value": "${{ needs.accessibility.result == 'success' && '✅ Passed' || needs.accessibility.result == 'cancelled' && '⏹️ Cancelled' || '❌ Failed' }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                      "short": false
                    }
                  ],
                  "footer": "GitHub Actions • ${{ github.workflow }}",
                  "ts": ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send detailed failure notification
        if: steps.overall-result.outputs.result == 'failure' && needs.e2e-tests.outputs.failed-tests != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          custom_payload: |
            {
              "channel": "#nico-ranking-alerts",
              "username": "E2E Test Bot",
              "icon_emoji": ":warning:",
              "attachments": [
                {
                  "color": "danger",
                  "title": "🔍 Failed Test Details",
                  "fields": [
                    {
                      "title": "Failed Tests",
                      "value": "${{ needs.e2e-tests.outputs.failed-tests }}",
                      "short": false
                    },
                    {
                      "title": "Action Required",
                      "value": "Check the test reports and fix failing tests",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  merge-reports:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: playwright-report-*
        merge-multiple: true

    - name: Merge test reports
      run: |
        npm install -g @playwright/test
        npx playwright merge-reports --reporter html ./playwright-report-*

    - name: Upload merged report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-merged
        path: playwright-report/
        retention-days: 30

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    - name: Start server for Lighthouse
      run: |
        npm run start &
        sleep 15
        curl --retry 10 --retry-connrefused http://localhost:3000 || exit 1
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        NODE_ENV: production
    
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v11
      with:
        urls: |
          http://localhost:3000
        uploadArtifacts: true
        temporaryPublicStorage: true
        runs: 1

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install -D axe-playwright

    - name: Build and start server
      run: |
        npm run build
        PORT=3001 npm run start &
        sleep 15
        curl --retry 10 --retry-connrefused http://localhost:3001 || exit 1
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_RANKING_ID: ${{ secrets.KV_RANKING_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        NODE_ENV: production

    - name: Run accessibility tests
      run: PLAYWRIGHT_BASE_URL=http://localhost:3001 npx playwright test tests/e2e/accessibility-seo.spec.ts --project=chromium

    - name: Upload accessibility results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: accessibility-results
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore