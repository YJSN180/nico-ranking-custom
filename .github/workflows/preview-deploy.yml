name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Deploy Worker Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Generate unique preview token
          PREVIEW_TOKEN=$(openssl rand -hex 16)
          echo "PREVIEW_TOKEN=$PREVIEW_TOKEN" >> $GITHUB_ENV
          
          # Deploy with PR-specific environment
          npx wrangler deploy \
            --env pr-${{ github.event.number }} \
            --var ENVIRONMENT:preview \
            --var PREVIEW_TOKEN:$PREVIEW_TOKEN \
            --config wrangler-preview.toml
          
          # Construct Worker URL
          WORKER_URL="https://pr-${{ github.event.number }}-nico-ranking-api-gateway.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          
      - name: Comment Worker URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Worker Preview: ${{ steps.deploy.outputs.worker_url }}'
            })

  deploy-vercel:
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Install Vercel CLI
          npm i -g vercel
          
          # Deploy with Worker URL as environment variable
          DEPLOYMENT_URL=$(vercel deploy \
            --token=$VERCEL_TOKEN \
            --build-env NEXT_PUBLIC_WORKER_URL=${{ needs.deploy-worker.outputs.worker_url }} \
            --build-env NEXT_PUBLIC_PREVIEW_TOKEN=${{ env.PREVIEW_TOKEN }} \
            --yes)
          
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          
      - name: Comment Preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🎉 Preview Environment Ready!
            
            - **Frontend**: ${{ steps.vercel.outputs.deployment_url }}
            - **Worker API**: ${{ needs.deploy-worker.outputs.worker_url }}
            
            This preview will be automatically cleaned up when the PR is closed.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })