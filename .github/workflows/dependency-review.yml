name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the workflow if high or critical vulnerabilities are found
          fail-on-severity: high
          
          # Block PRs that introduce vulnerable dependencies
          vulnerability-check: true
          
          # Temporarily disable license check due to Unicode combination license parsing issues
          # The failing packages (unicode-*) use standard Unicode and MIT licenses which are safe
          license-check: false