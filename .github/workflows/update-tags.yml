name: Update Tag Accumulation Data (Manual Backfill)

on:
  workflow_dispatch:

concurrency:
  group: update-tags-manual
  cancel-in-progress: false

jobs:
  update-tags:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Collect tags from API
      run: |
        echo "📊 タグ収集開始 (全23ジャンル)"
        node scripts/fetch-tags-from-api.cjs
      timeout-minutes: 10
    
    - name: Upload to R2
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        echo "📤 canonical key を gzip 契約で更新"
        npm run upload-tag-accumulation

    - name: Verify upload
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        npx tsx scripts/check-r2-data.ts
    
    - name: Create summary
      if: always()
      run: |
        echo "## タグ累積データ手動バックフィル結果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f data/tag-accumulation.json ]; then
          TAG_COUNT=$(jq '.tags | length' data/tag-accumulation.json)
          FILE_SIZE=$(du -h data/tag-accumulation.json | cut -f1)
          echo "- ✅ タグ数: $TAG_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 ファイルサイズ: $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 更新時刻: $(date '+%Y-%m-%d %H:%M:%S JST')" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ タグデータ生成失敗" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Error notification
      if: failure()
      run: |
        echo "::error::タグ累積データの更新に失敗しました"
