name: Monitor Resource Usage

on:
  schedule:
    # 3時間ごとに実行
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Collect Resource Usage
        id: metrics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # リソース使用状況を収集（30日間の実データ）
          node .github/scripts/monitor-resources.cjs 30d
      
      
      
      - name: Store Resource Usage Statistics
        run: |
          # 統計をアーティファクトとして保存
          mkdir -p stats
          cat << EOF > stats/resource-usage-$(date +%Y%m%d-%H%M%S).json
          {
            "timestamp": "${{ steps.metrics.outputs.timestamp }}",
            "timeRange": "${{ steps.metrics.outputs.time_range }}",
            "r2": {
              "storage": {
                "gb": ${{ steps.metrics.outputs.r2_storage_gb }},
                "usage_percent": ${{ steps.metrics.outputs.r2_storage_usage }},
                "object_count": ${{ steps.metrics.outputs.r2_object_count }}
              },
              "classA": {
                "actual_usage": ${{ steps.metrics.outputs.r2_classA_actual }},
                "usage_percent": ${{ steps.metrics.outputs.r2_classA_usage }}
              },
              "classB": {
                "actual_usage": ${{ steps.metrics.outputs.r2_classB_actual }},
                "usage_percent": ${{ steps.metrics.outputs.r2_classB_usage }}
              }
            },
            "kv": {
              "storage": {
                "gb": ${{ steps.metrics.outputs.kv_storage_gb }},
                "usage_percent": ${{ steps.metrics.outputs.kv_storage_usage }},
                "key_count": ${{ steps.metrics.outputs.kv_key_count }}
              },
              "reads": {
                "daily_average": ${{ steps.metrics.outputs.kv_reads_daily_avg }},
                "usage_percent": ${{ steps.metrics.outputs.kv_reads_usage }}
              },
              "writes": {
                "daily_average": ${{ steps.metrics.outputs.kv_writes_daily_avg }},
                "usage_percent": ${{ steps.metrics.outputs.kv_writes_usage }}
              }
            },
            "warnings": ${{ steps.metrics.outputs.warnings }}
          }
          EOF
      
      - name: Upload Statistics
        uses: actions/upload-artifact@v4
        with:
          name: resource-usage-statistics
          path: stats/
          retention-days: 30