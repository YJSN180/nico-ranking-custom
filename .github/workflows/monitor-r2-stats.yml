name: Monitor Resource Usage

on:
  schedule:
    # 3時間ごとに実行
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Collect Resource Usage
        id: metrics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # リソース使用状況を収集
          node .github/scripts/monitor-resources.cjs
      
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          timestamp: ${{ steps.metrics.outputs.timestamp }}
          warning_messages: ${{ steps.metrics.outputs.warning_messages }}
          r2_storage_gb: ${{ steps.metrics.outputs.r2_storage_gb }}
          r2_storage_usage: ${{ steps.metrics.outputs.r2_storage_usage }}
          r2_classA_monthly: ${{ steps.metrics.outputs.r2_classA_monthly }}
          r2_classA_usage: ${{ steps.metrics.outputs.r2_classA_usage }}
          r2_classB_monthly: ${{ steps.metrics.outputs.r2_classB_monthly }}
          r2_classB_usage: ${{ steps.metrics.outputs.r2_classB_usage }}
          kv_storage_gb: ${{ steps.metrics.outputs.kv_storage_gb }}
          kv_storage_usage: ${{ steps.metrics.outputs.kv_storage_usage }}
          kv_reads_daily: ${{ steps.metrics.outputs.kv_reads_daily }}
          kv_reads_usage: ${{ steps.metrics.outputs.kv_reads_usage }}
          kv_writes_daily: ${{ steps.metrics.outputs.kv_writes_daily }}
          kv_writes_usage: ${{ steps.metrics.outputs.kv_writes_usage }}
        run: |
          # Slack通知を送信
          node .github/scripts/notify-resource-usage.cjs
      
      - name: Send Critical Alert on High Usage
        if: steps.metrics.outputs.warnings > 0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cat << EOF > critical-alert.js
          const https = require('https');
          
          async function sendSlackMessage(message) {
            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            if (!webhookUrl) return;

            const data = JSON.stringify(message);
            const url = new URL(webhookUrl);
            const options = {
              hostname: url.hostname,
              port: 443,
              path: url.pathname,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(data)
              }
            };

            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let responseData = '';
                res.on('data', chunk => responseData += chunk);
                res.on('end', () => resolve(JSON.parse(responseData)));
              });
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          const alertMessage = {
            channel: 'C092SFGUSKC',
            blocks: [
              {
                type: "header",
                text: {
                  type: "plain_text",
                  text: "🚨 リソース使用量警告"
                }
              },
              {
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: "無料枠の使用量が上限に近づいています。詳細は定期レポートをご確認ください。"
                }
              }
            ]
          };

          sendSlackMessage(alertMessage).then(() => {
            console.log('Critical alert sent');
          }).catch(console.error);
          EOF
          
          node critical-alert.js
      
      - name: Store Resource Usage Statistics
        run: |
          # 統計をアーティファクトとして保存
          mkdir -p stats
          cat << EOF > stats/resource-usage-$(date +%Y%m%d-%H%M%S).json
          {
            "timestamp": "${{ steps.metrics.outputs.timestamp }}",
            "r2": {
              "storage": {
                "gb": ${{ steps.metrics.outputs.r2_storage_gb }},
                "usage_percent": ${{ steps.metrics.outputs.r2_storage_usage }}
              },
              "classA": {
                "monthly_projected": ${{ steps.metrics.outputs.r2_classA_monthly }},
                "usage_percent": ${{ steps.metrics.outputs.r2_classA_usage }}
              },
              "classB": {
                "monthly_projected": ${{ steps.metrics.outputs.r2_classB_monthly }},
                "usage_percent": ${{ steps.metrics.outputs.r2_classB_usage }}
              }
            },
            "kv": {
              "storage": {
                "gb": ${{ steps.metrics.outputs.kv_storage_gb }},
                "usage_percent": ${{ steps.metrics.outputs.kv_storage_usage }}
              },
              "reads": {
                "daily_projected": ${{ steps.metrics.outputs.kv_reads_daily }},
                "usage_percent": ${{ steps.metrics.outputs.kv_reads_usage }}
              },
              "writes": {
                "daily_projected": ${{ steps.metrics.outputs.kv_writes_daily }},
                "usage_percent": ${{ steps.metrics.outputs.kv_writes_usage }}
              }
            },
            "warnings": ${{ steps.metrics.outputs.warnings }}
          }
          EOF
      
      - name: Upload Statistics
        uses: actions/upload-artifact@v4
        with:
          name: resource-usage-statistics
          path: stats/
          retention-days: 30