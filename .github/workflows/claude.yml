name: Claude Code Action

# @claude メンションに応答してClaude Code Actionを実行
# OAuth認証を使用（Claude Max subscription）
#
# トリガー:
# - PRコメントで @claude をメンション
# - PRレビューで @claude をメンション
#
# セキュリティ注: このワークフローはrunコマンドでユーザー入力を
# 直接使用していません。条件式(if)はGitHub Actions式評価であり、
# シェルインジェクションのリスクはありません。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# 同時実行を制御
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  external-mention-guidance:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association != 'OWNER' &&
      github.event.comment.author_association != 'MEMBER' &&
      github.event.comment.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Reply with guidance
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "このリポジトリでは、外部ユーザーからの \`@claude\` メンションでは privileged automation を起動しません。メンテナー経由で依頼してください。"

  claude-code-action:
    # PRに対するコメントで @claude が含まれている場合のみ実行
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: grll/claude-code-action@eaa832e2642dfd5ecf723e5d99fc72c8f291c9bc
        with:
          # OAuth認証（Claude Max subscription）
          use_oauth: true
          claude_access_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          claude_refresh_token: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          claude_expires_at: ${{ secrets.CLAUDE_EXPIRES_AT }}

          # トークンリフレッシュ用
          github_token: ${{ secrets.SECRETS_ADMIN_PAT }}
          secrets_admin_pat: ${{ secrets.SECRETS_ADMIN_PAT }}

          # タイムアウト設定
          timeout_minutes: "60"

          # 許可するツール
          # - 基本: Bash, Read, Write, Edit, MultiEdit, Glob, Grep
          # - タスク管理: TodoRead, TodoWrite
          # - Web: WebFetch
          # - サブエージェント: Task (複雑なタスクの分割・並列処理)
          allowed_tools: "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,TodoRead,TodoWrite,WebFetch,Task"
